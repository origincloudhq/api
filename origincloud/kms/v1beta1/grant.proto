syntax = "proto3";

// Grants: permission for one platform host to use one key for one
// operation and one encryption context, for at most an hour at a time.
//
// The platform's services make grants for the hosts that need a key at
// that moment, such as the host a volume is attached to, which decrypts
// the volume's data key under the grant. A grant is kept by the zone of
// the host it is for, so making, renewing and using it keep working while
// any other zone of the region is down. A key that is disabled or deleted
// opens nothing under any grant.
//
// Making, renewing and deleting a grant, and every use under one, is
// recorded in the organization's audit log.
package origincloud.kms.v1beta1;

import "google/api/annotations.proto";
import "google/api/client.proto";
import "google/api/field_behavior.proto";
import "google/api/field_info.proto";
import "google/api/resource.proto";
import "google/protobuf/duration.proto";
import "google/protobuf/empty.proto";
import "google/protobuf/timestamp.proto";

// A key's grants.
//
// Making, renewing and deleting a grant needs `kms.grant.create`,
// `kms.grant.update` and `kms.grant.delete` on the key's project, which the
// platform's own services hold where you let them use your keys; none of
// them lets the holder use the key itself. Reading and listing need
// `kms.grant.get` and `kms.grant.list`.
service GrantService {
  option (google.api.default_host) = "kms.origincloudapis.eu";

  // Returns a grant that hasn't expired; an expired one is `NOT_FOUND`. A
  // grant made moments ago may be refused with `SERVICE_UNAVAILABLE`,
  // retryable, until its zone's change arrives. Needs `kms.grant.get` on
  // the project.
  rpc GetGrant(GetGrantRequest) returns (Grant) {
    option (google.api.http) = {get: "/v1beta1/{name=projects/*/regions/*/keys/*/grants/*}"};
    option (google.api.method_signature) = "name";
  }

  // Lists a key's grants that haven't expired, in every zone, ordered by
  // name. A grant made moments ago may be missing from the list until its
  // zone's change arrives. Needs `kms.grant.list` on the project.
  rpc ListGrants(ListGrantsRequest) returns (ListGrantsResponse) {
    option (google.api.http) = {get: "/v1beta1/{parent=projects/*/regions/*/keys/*}/grants"};
    option (google.api.method_signature) = "parent";
  }

  // Makes a grant on an `ENCRYPT_DECRYPT` key for one host, refused with
  // `BAD_REQUEST` for a key of another purpose, a host that isn't one of
  // the region's, an empty encryption context, or a `ttl` outside 1 to 60
  // minutes, and with `CONFLICT` for a key that isn't enabled. Needs
  // `kms.grant.create` on the project.
  rpc CreateGrant(CreateGrantRequest) returns (Grant) {
    option (google.api.http) = {
      post: "/v1beta1/{parent=projects/*/regions/*/keys/*}/grants"
      body: "grant"
    };
    option (google.api.method_signature) = "parent,grant";
  }

  // Extends a grant that hasn't expired to `ttl` from now. An expired
  // grant isn't renewed: `CONFLICT`, and a new one is made instead. Needs
  // `kms.grant.update` on the project.
  rpc RenewGrant(RenewGrantRequest) returns (Grant) {
    option (google.api.http) = {
      post: "/v1beta1/{name=projects/*/regions/*/keys/*/grants/*}:renew"
      body: "*"
    };
    option (google.api.method_signature) = "name,ttl";
  }

  // Ends a grant before it expires: from then on it opens nothing. Needs
  // `kms.grant.delete` on the project.
  rpc DeleteGrant(DeleteGrantRequest) returns (google.protobuf.Empty) {
    option (google.api.http) = {delete: "/v1beta1/{name=projects/*/regions/*/keys/*/grants/*}"};
    option (google.api.method_signature) = "name";
  }
}

// A grant: one host may use one key for one operation, with exactly one
// encryption context, until `expire_time`.
message Grant {
  option (google.api.resource) = {
    type: "kms.origincloudapis.eu/Grant"
    pattern: "projects/{project}/regions/{region}/keys/{key}/grants/{grant}"
    plural: "grants"
    singular: "grant"
  };

  // What a grant lets its host do.
  enum Operation {
    // Not set.
    OPERATION_UNSPECIFIED = 0;
    // Decrypt ciphertexts made under the key with the grant's encryption
    // context.
    DECRYPT = 1;
  }

  // The grant's resource name.
  string name = 1 [(google.api.field_behavior) = IDENTIFIER];

  // What the host may do with the key.
  Operation operation = 2 [
    (google.api.field_behavior) = REQUIRED,
    (google.api.field_behavior) = IMMUTABLE
  ];

  // The platform host the grant is for, by the SPIFFE ID its certificate
  // names, which ends in `/zones/{zone}/hosts/{host}`.
  string grantee = 3 [
    (google.api.field_behavior) = REQUIRED,
    (google.api.field_behavior) = IMMUTABLE
  ];

  // The encryption context a use must carry, exactly; never empty.
  map<string, string> encryption_context = 4 [
    (google.api.field_behavior) = REQUIRED,
    (google.api.field_behavior) = IMMUTABLE
  ];

  // How long the grant lives from now: 1 to 60 minutes.
  google.protobuf.Duration ttl = 5 [
    (google.api.field_behavior) = INPUT_ONLY,
    (google.api.field_behavior) = REQUIRED
  ];

  // The zone that keeps the grant: its host's.
  string zone = 6 [(google.api.field_behavior) = OUTPUT_ONLY];

  // Who made the grant.
  string delegate = 7 [(google.api.field_behavior) = OUTPUT_ONLY];

  // When the grant was made.
  google.protobuf.Timestamp create_time = 8 [(google.api.field_behavior) = OUTPUT_ONLY];

  // When the grant was last renewed, or made.
  google.protobuf.Timestamp renew_time = 9 [(google.api.field_behavior) = OUTPUT_ONLY];

  // When the grant stops opening anything unless renewed before.
  google.protobuf.Timestamp expire_time = 10 [(google.api.field_behavior) = OUTPUT_ONLY];
}

// The request for GetGrant.
message GetGrantRequest {
  // The grant to return.
  string name = 1 [
    (google.api.field_behavior) = REQUIRED,
    (google.api.resource_reference).type = "kms.origincloudapis.eu/Grant"
  ];
}

// The request for ListGrants.
message ListGrantsRequest {
  // The key whose grants to list.
  string parent = 1 [
    (google.api.field_behavior) = REQUIRED,
    (google.api.resource_reference).child_type = "kms.origincloudapis.eu/Grant"
  ];

  // The most grants to return; the server clamps it, and 0 means its
  // default.
  int32 page_size = 2 [(google.api.field_behavior) = OPTIONAL];

  // A previous response's `next_page_token`, for the page after it.
  string page_token = 3 [(google.api.field_behavior) = OPTIONAL];
}

// The response for ListGrants.
message ListGrantsResponse {
  // The grants on this page.
  repeated Grant grants = 1;

  // The token for the next page; empty on the last one.
  string next_page_token = 2;
}

// The request for CreateGrant.
message CreateGrantRequest {
  // The key to grant.
  string parent = 1 [
    (google.api.field_behavior) = REQUIRED,
    (google.api.resource_reference).child_type = "kms.origincloudapis.eu/Grant"
  ];

  // The grant to make: its operation, host, encryption context and `ttl`.
  Grant grant = 2 [(google.api.field_behavior) = REQUIRED];

  // A UUID; a repeat with the same id within a day returns the grant the
  // first request made, instead of making a second.
  string request_id = 3 [
    (google.api.field_info).format = UUID4,
    (google.api.field_behavior) = OPTIONAL
  ];
}

// The request for RenewGrant.
message RenewGrantRequest {
  // The grant to renew.
  string name = 1 [
    (google.api.field_behavior) = REQUIRED,
    (google.api.resource_reference).type = "kms.origincloudapis.eu/Grant"
  ];

  // How long the grant lives from now: 1 to 60 minutes.
  google.protobuf.Duration ttl = 2 [(google.api.field_behavior) = REQUIRED];
}

// The request for DeleteGrant.
message DeleteGrantRequest {
  // The grant to end.
  string name = 1 [
    (google.api.field_behavior) = REQUIRED,
    (google.api.resource_reference).type = "kms.origincloudapis.eu/Grant"
  ];
}
