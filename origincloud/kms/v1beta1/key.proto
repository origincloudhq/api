syntax = "proto3";

// Keys: encryption and signing keys kept by the platform, whose material
// never leaves it.
//
// A key belongs to a project and a region (`regions/{region}`), never to
// a zone: every zone of its region serves it. Encrypt, Decrypt,
// GenerateDataKey, Sign and GetPublicKey are answered by the zone that
// receives the request, from its own copy of the key, so they keep working
// while any one zone of the region is down. Creating, reading, listing,
// rotating, enabling, disabling, deleting and undeleting a key are answered
// by the region's home zone; while it is down they are refused with
// `SERVICE_UNAVAILABLE`, retryable. A change reaches the region's other
// zones within seconds: until it has, a data operation that needs it, such
// as one with a key just created, is refused with `SERVICE_UNAVAILABLE`,
// retryable, never with `NOT_FOUND`.
//
// Every use of a key but GetPublicKey, and every change to it, is recorded
// in the organization's audit log with the caller and the encryption
// context.
package origincloud.kms.v1beta1;

import "google/api/annotations.proto";
import "google/api/client.proto";
import "google/api/field_behavior.proto";
import "google/api/field_info.proto";
import "google/api/resource.proto";
import "google/protobuf/duration.proto";
import "google/protobuf/field_mask.proto";
import "google/protobuf/timestamp.proto";

// A version of a key: one generation of its material, numbered from 1.
option (google.api.resource_definition) = {
  type: "kms.origincloudapis.eu/KeyVersion"
  pattern: "projects/{project}/regions/{region}/keys/{key}/versions/{version}"
  plural: "keyVersions"
  singular: "keyVersion"
};

// Keys and the operations made with them.
//
// An `ENCRYPT_DECRYPT` key encrypts with AES-256-GCM-SIV. Its ciphertext
// names the key version that made it but not the key: Decrypt names the
// key, and a ciphertext decrypts only under the key and the encryption
// context it was made with. A signing key signs with ECDSA over P-256 and
// SHA-256 (ASN.1 DER signatures) or with Ed25519; its public keys are read
// with GetPublicKey.
service KeyService {
  option (google.api.default_host) = "kms.origincloudapis.eu";

  // Returns a key, deleted or not. Needs `kms.key.get` on the project.
  rpc GetKey(GetKeyRequest) returns (Key) {
    option (google.api.http) = {get: "/v1beta1/{name=projects/*/regions/*/keys/*}"};
    option (google.api.method_signature) = "name";
  }

  // Lists a project's keys in a region, ordered by name. Deleted ones are
  // listed only when `show_deleted` is set, so a page may hold fewer keys
  // than `page_size` and still be followed by another. Needs `kms.key.list`
  // on the project.
  rpc ListKeys(ListKeysRequest) returns (ListKeysResponse) {
    option (google.api.http) = {get: "/v1beta1/{parent=projects/*/regions/*}/keys"};
    option (google.api.method_signature) = "parent";
  }

  // Creates a key, `ENABLED`, with its first version as the primary. The
  // platform assigns its id, which its `name` returns; an id is never used
  // again. Needs `kms.key.create` on the project.
  rpc CreateKey(CreateKeyRequest) returns (Key) {
    option (google.api.http) = {
      post: "/v1beta1/{parent=projects/*/regions/*}/keys"
      body: "key"
    };
    option (google.api.method_signature) = "parent,key";
  }

  // Enables or disables a key: `state` is the only field it changes. A
  // disabled key refuses every operation but GetPublicKey with `CONFLICT`
  // until it is enabled again. Setting the state the key has already
  // succeeds and changes nothing. A deleted key can't be enabled or
  // disabled: undelete it first. Needs `kms.key.update` on the project.
  rpc UpdateKey(UpdateKeyRequest) returns (Key) {
    option (google.api.http) = {
      patch: "/v1beta1/{key.name=projects/*/regions/*/keys/*}"
      body: "key"
    };
    option (google.api.method_signature) = "key,update_mask";
  }

  // Deletes a key: it becomes `DELETED` at once, refuses every operation
  // but GetPublicKey, and its material is destroyed at `purge_time`, after
  // `destroy_delay`. Until then UndeleteKey restores it, disabled. After it,
  // nothing it encrypted can ever be decrypted again. Deleting a deleted key
  // succeeds and changes nothing. Needs `kms.key.delete` on the project.
  rpc DeleteKey(DeleteKeyRequest) returns (Key) {
    option (google.api.http) = {delete: "/v1beta1/{name=projects/*/regions/*/keys/*}"};
    option (google.api.method_signature) = "name";
  }

  // Restores a deleted key whose material isn't destroyed yet: it becomes
  // `DISABLED`, to be enabled with UpdateKey. Refused with `CONFLICT` for a
  // key that isn't deleted, or whose `purge_time` has passed. Needs
  // `kms.key.delete` on the project.
  rpc UndeleteKey(UndeleteKeyRequest) returns (Key) {
    option (google.api.http) = {
      post: "/v1beta1/{name=projects/*/regions/*/keys/*}:undelete"
      body: "*"
    };
    option (google.api.method_signature) = "name";
  }

  // Adds a new version to a key and makes it the primary: new ciphertexts
  // and signatures use it, and every earlier version still decrypts and
  // its public key stays readable. Refused with `CONFLICT` for a key that
  // isn't enabled. Needs `kms.key.rotate` on the project.
  rpc RotateKey(RotateKeyRequest) returns (Key) {
    option (google.api.http) = {
      post: "/v1beta1/{name=projects/*/regions/*/keys/*}:rotate"
      body: "*"
    };
    option (google.api.method_signature) = "name";
  }

  // Encrypts up to 64 KiB with an `ENCRYPT_DECRYPT` key's primary version,
  // bound to the encryption context. For more data, encrypt it yourself
  // with a data key from GenerateDataKey. Refused with `CONFLICT` for a key
  // that isn't enabled, and with `BAD_REQUEST` for a signing key. Needs
  // `kms.key.encrypt` on the project.
  //
  // (-- api-linter: core::0136::verb-noun=disabled
  //     aip.dev/not-precedent: the name every key management API gives it. --)
  rpc Encrypt(EncryptRequest) returns (EncryptResponse) {
    option (google.api.http) = {
      post: "/v1beta1/{name=projects/*/regions/*/keys/*}:encrypt"
      body: "*"
    };
    option (google.api.method_signature) = "name,plaintext";
  }

  // Decrypts a ciphertext Encrypt or GenerateDataKey made with this key,
  // given the same encryption context. Refused with `BAD_REQUEST` for a
  // ciphertext that doesn't decrypt under this key and context, and with
  // `CONFLICT` for a key that isn't enabled. Needs `kms.key.decrypt` on the
  // project.
  //
  // (-- api-linter: core::0136::verb-noun=disabled
  //     aip.dev/not-precedent: the name every key management API gives it. --)
  rpc Decrypt(DecryptRequest) returns (DecryptResponse) {
    option (google.api.http) = {
      post: "/v1beta1/{name=projects/*/regions/*/keys/*}:decrypt"
      body: "*"
    };
    option (google.api.method_signature) = "name,ciphertext";
  }

  // Returns a new random 256-bit data key, in plaintext and encrypted under
  // an `ENCRYPT_DECRYPT` key's primary version with the encryption context.
  // Encrypt your data with the plaintext, keep only the ciphertext beside
  // it, and recover the data key with Decrypt when you need it. Needs
  // `kms.key.generate_data_key` on the project.
  //
  // (-- api-linter: core::0136::http-uri-suffix=disabled
  //     aip.dev/not-precedent: the suffix names what is generated, a data key, not the key the path names. --)
  rpc GenerateDataKey(GenerateDataKeyRequest) returns (GenerateDataKeyResponse) {
    option (google.api.http) = {
      post: "/v1beta1/{name=projects/*/regions/*/keys/*}:generateDataKey"
      body: "*"
    };
    option (google.api.method_signature) = "name";
  }

  // Signs up to 64 KiB with a signing key's primary version. ECDSA hashes
  // the data with SHA-256 itself: send the data, not a digest. Refused with
  // `CONFLICT` for a key that isn't enabled, and with `BAD_REQUEST` for an
  // `ENCRYPT_DECRYPT` key. Needs `kms.key.sign` on the project.
  //
  // (-- api-linter: core::0136::verb-noun=disabled
  //     aip.dev/not-precedent: the name every key management API gives it. --)
  rpc Sign(SignRequest) returns (SignResponse) {
    option (google.api.http) = {
      post: "/v1beta1/{name=projects/*/regions/*/keys/*}:sign"
      body: "*"
    };
    option (google.api.method_signature) = "name,data";
  }

  // Returns a signing key version's public key, to verify its signatures
  // with. Answered for a disabled or deleted key too, until its material is
  // destroyed. Refused with `BAD_REQUEST` for an `ENCRYPT_DECRYPT` key.
  // Needs `kms.key.get_public_key` on the project.
  rpc GetPublicKey(GetPublicKeyRequest) returns (PublicKey) {
    option (google.api.http) = {get: "/v1beta1/{name=projects/*/regions/*/keys/*/versions/*/publicKey}"};
    option (google.api.method_signature) = "name";
  }
}

// A key: its versions' material is kept by the platform and never leaves
// it.
message Key {
  option (google.api.resource) = {
    type: "kms.origincloudapis.eu/Key"
    pattern: "projects/{project}/regions/{region}/keys/{key}"
    plural: "keys"
    singular: "key"
  };

  // What a key is for, and the algorithm it uses.
  enum Purpose {
    // Not set.
    PURPOSE_UNSPECIFIED = 0;
    // Encrypt, Decrypt and GenerateDataKey, with AES-256-GCM-SIV.
    ENCRYPT_DECRYPT = 1;
    // Sign with ECDSA over P-256 and SHA-256; signatures are ASN.1 DER.
    SIGN_ECDSA_P256_SHA256 = 2;
    // Sign with Ed25519; signatures are 64 bytes.
    SIGN_ED25519 = 3;
  }

  // Whether a key can be used.
  enum State {
    // Not set.
    STATE_UNSPECIFIED = 0;
    // Serves every operation of its purpose.
    ENABLED = 1;
    // Refuses every operation but GetPublicKey until enabled again.
    DISABLED = 2;
    // Deleted: refuses every operation but GetPublicKey. Until
    // `purge_time` UndeleteKey restores it; after it, its material is
    // destroyed.
    DELETED = 3;
  }

  // A version of the key: one generation of its material.
  message Version {
    // The version's resource name,
    // `projects/{project}/regions/{region}/keys/{key}/versions/{version}`,
    // numbered from 1.
    string key_version = 1 [
      (google.api.field_behavior) = OUTPUT_ONLY,
      (google.api.resource_reference).type = "kms.origincloudapis.eu/KeyVersion"
    ];

    // When the version was created.
    google.protobuf.Timestamp create_time = 2 [(google.api.field_behavior) = OUTPUT_ONLY];
  }

  // The key's resource name.
  string name = 1 [(google.api.field_behavior) = IDENTIFIER];

  // What the key is for.
  Purpose purpose = 2 [
    (google.api.field_behavior) = REQUIRED,
    (google.api.field_behavior) = IMMUTABLE
  ];

  // Whether the key can be used. A new key is `ENABLED`; UpdateKey sets it
  // to `ENABLED` or `DISABLED`, and DeleteKey makes it `DELETED`.
  //
  // (-- api-linter: core::0216::state-field-output-only=disabled
  //     aip.dev/not-precedent: enabling and disabling a key is setting its state. --)
  State state = 3 [(google.api.field_behavior) = OPTIONAL];

  // The version new ciphertexts and signatures use.
  string primary_version = 4 [
    (google.api.field_behavior) = OUTPUT_ONLY,
    (google.api.resource_reference).type = "kms.origincloudapis.eu/KeyVersion"
  ];

  // Every version, oldest first. RotateKey adds one.
  repeated Version versions = 5 [(google.api.field_behavior) = OUTPUT_ONLY];

  // When the key was created.
  google.protobuf.Timestamp create_time = 6 [(google.api.field_behavior) = OUTPUT_ONLY];

  // When the key last changed.
  google.protobuf.Timestamp update_time = 7 [(google.api.field_behavior) = OUTPUT_ONLY];

  // When a deleted key's material is destroyed, or was; unset unless the
  // key is `DELETED`.
  google.protobuf.Timestamp purge_time = 8 [(google.api.field_behavior) = OUTPUT_ONLY];
}

// A signing key version's public key.
message PublicKey {
  option (google.api.resource) = {
    type: "kms.origincloudapis.eu/PublicKey"
    pattern: "projects/{project}/regions/{region}/keys/{key}/versions/{version}/publicKey"
    plural: "publicKeys"
    singular: "publicKey"
  };

  // The public key's resource name: its version's, followed by
  // `/publicKey`.
  string name = 1 [(google.api.field_behavior) = IDENTIFIER];

  // The algorithm the key version signs with.
  Key.Purpose algorithm = 2 [(google.api.field_behavior) = OUTPUT_ONLY];

  // The public key as a PEM-encoded SubjectPublicKeyInfo, which OpenSSL and
  // most libraries read.
  string pem = 3 [(google.api.field_behavior) = OUTPUT_ONLY];
}

// The request for GetKey.
message GetKeyRequest {
  // The key to return.
  string name = 1 [
    (google.api.field_behavior) = REQUIRED,
    (google.api.resource_reference).type = "kms.origincloudapis.eu/Key"
  ];
}

// The request for ListKeys.
message ListKeysRequest {
  // The project and region whose keys to list,
  // `projects/{project}/regions/{region}`.
  string parent = 1 [
    (google.api.field_behavior) = REQUIRED,
    (google.api.resource_reference).child_type = "kms.origincloudapis.eu/Key"
  ];

  // The most keys to return; the server clamps it, and 0 means its
  // default.
  int32 page_size = 2 [(google.api.field_behavior) = OPTIONAL];

  // A previous response's `next_page_token`, for the page after it.
  string page_token = 3 [(google.api.field_behavior) = OPTIONAL];

  // Whether deleted keys are listed too.
  bool show_deleted = 4 [(google.api.field_behavior) = OPTIONAL];
}

// The response for ListKeys.
message ListKeysResponse {
  // The keys on this page.
  repeated Key keys = 1;

  // The token for the next page; empty on the last one.
  string next_page_token = 2;
}

// The request for CreateKey.
message CreateKeyRequest {
  // The project and region to create the key in,
  // `projects/{project}/regions/{region}`.
  string parent = 1 [
    (google.api.field_behavior) = REQUIRED,
    (google.api.resource_reference).child_type = "kms.origincloudapis.eu/Key"
  ];

  // The key to create: its `purpose`.
  Key key = 2 [(google.api.field_behavior) = REQUIRED];

  // A UUID; a repeat with the same id within a day returns the key the
  // first request created, as it was then, instead of creating a second
  // one.
  string request_id = 3 [
    (google.api.field_info).format = UUID4,
    (google.api.field_behavior) = OPTIONAL
  ];
}

// The request for UpdateKey.
message UpdateKeyRequest {
  // The key, by its name, with the state to set: `ENABLED` or `DISABLED`.
  Key key = 1 [(google.api.field_behavior) = REQUIRED];

  // The fields to change: `state`, or `*`.
  google.protobuf.FieldMask update_mask = 2 [(google.api.field_behavior) = REQUIRED];

  // A UUID; a repeat with the same id within a day returns the key as the
  // first request left it, instead of changing it again.
  string request_id = 3 [
    (google.api.field_info).format = UUID4,
    (google.api.field_behavior) = OPTIONAL
  ];
}

// The request for DeleteKey.
//
// (-- api-linter: core::0135::force-field=disabled
//     aip.dev/not-precedent: a key's versions are part of it and are deleted with it, so there is nothing to force. --)
message DeleteKeyRequest {
  // The key to delete.
  string name = 1 [
    (google.api.field_behavior) = REQUIRED,
    (google.api.resource_reference).type = "kms.origincloudapis.eu/Key"
  ];

  // How long until the key's material is destroyed: whole days, from 1 to
  // 90; 30 days when unset.
  //
  // (-- api-linter: core::0135::request-unknown-fields=disabled
  //     aip.dev/not-precedent: a key's material is destroyed only after a delay the caller chooses. --)
  google.protobuf.Duration destroy_delay = 2 [(google.api.field_behavior) = OPTIONAL];

  // A UUID; a repeat with the same id within a day returns the key as the
  // first request left it.
  string request_id = 3 [
    (google.api.field_info).format = UUID4,
    (google.api.field_behavior) = OPTIONAL
  ];
}

// The request for UndeleteKey.
message UndeleteKeyRequest {
  // The deleted key to restore.
  string name = 1 [
    (google.api.field_behavior) = REQUIRED,
    (google.api.resource_reference).type = "kms.origincloudapis.eu/Key"
  ];

  // A UUID; a repeat with the same id within a day returns the key as the
  // first request left it, instead of answering `CONFLICT`.
  string request_id = 2 [
    (google.api.field_info).format = UUID4,
    (google.api.field_behavior) = OPTIONAL
  ];
}

// The request for RotateKey.
message RotateKeyRequest {
  // The key to rotate.
  string name = 1 [
    (google.api.field_behavior) = REQUIRED,
    (google.api.resource_reference).type = "kms.origincloudapis.eu/Key"
  ];

  // A UUID; a repeat with the same id within a day returns the key as the
  // first request left it, instead of adding another version.
  string request_id = 2 [
    (google.api.field_info).format = UUID4,
    (google.api.field_behavior) = OPTIONAL
  ];
}

// The request for Encrypt.
message EncryptRequest {
  // The `ENCRYPT_DECRYPT` key to encrypt with.
  string name = 1 [
    (google.api.field_behavior) = REQUIRED,
    (google.api.resource_reference).type = "kms.origincloudapis.eu/Key"
  ];

  // The data to encrypt, at most 64 KiB.
  bytes plaintext = 2 [(google.api.field_behavior) = REQUIRED];

  // Pairs bound into the ciphertext, which Decrypt must be given again,
  // exactly. They aren't secret: the audit log records them. At most 16
  // pairs, each key and value 1 to 256 bytes.
  map<string, string> encryption_context = 3 [(google.api.field_behavior) = OPTIONAL];
}

// The response for Encrypt.
message EncryptResponse {
  // The ciphertext, to store and pass to Decrypt.
  bytes ciphertext = 1;

  // The key version that encrypted it.
  string key_version = 2 [(google.api.resource_reference).type = "kms.origincloudapis.eu/KeyVersion"];
}

// The request for Decrypt.
message DecryptRequest {
  // The key the ciphertext was made with.
  string name = 1 [
    (google.api.field_behavior) = REQUIRED,
    (google.api.resource_reference).type = "kms.origincloudapis.eu/Key"
  ];

  // What Encrypt or GenerateDataKey returned as `ciphertext`.
  bytes ciphertext = 2 [(google.api.field_behavior) = REQUIRED];

  // The encryption context the ciphertext was made with.
  map<string, string> encryption_context = 3 [(google.api.field_behavior) = OPTIONAL];
}

// The response for Decrypt.
message DecryptResponse {
  // The decrypted data.
  bytes plaintext = 1;

  // The key version that decrypted it.
  string key_version = 2 [(google.api.resource_reference).type = "kms.origincloudapis.eu/KeyVersion"];
}

// The request for GenerateDataKey.
message GenerateDataKeyRequest {
  // The `ENCRYPT_DECRYPT` key to encrypt the data key with.
  string name = 1 [
    (google.api.field_behavior) = REQUIRED,
    (google.api.resource_reference).type = "kms.origincloudapis.eu/Key"
  ];

  // Pairs bound into the data key's ciphertext, as Encrypt's.
  map<string, string> encryption_context = 2 [(google.api.field_behavior) = OPTIONAL];
}

// The response for GenerateDataKey.
message GenerateDataKeyResponse {
  // The 32-byte data key. Use it, then discard it: never store it.
  bytes plaintext = 1;

  // The data key encrypted under the key, to store beside your data and
  // pass to Decrypt.
  bytes ciphertext = 2;

  // The key version that encrypted it.
  string key_version = 3 [(google.api.resource_reference).type = "kms.origincloudapis.eu/KeyVersion"];
}

// The request for Sign.
message SignRequest {
  // The signing key to sign with.
  string name = 1 [
    (google.api.field_behavior) = REQUIRED,
    (google.api.resource_reference).type = "kms.origincloudapis.eu/Key"
  ];

  // The data to sign, at most 64 KiB.
  bytes data = 2 [(google.api.field_behavior) = REQUIRED];
}

// The response for Sign.
message SignResponse {
  // The signature: ASN.1 DER for ECDSA, 64 bytes for Ed25519.
  bytes signature = 1;

  // The key version that signed, whose public key verifies it.
  string key_version = 2 [(google.api.resource_reference).type = "kms.origincloudapis.eu/KeyVersion"];
}

// The request for GetPublicKey.
message GetPublicKeyRequest {
  // The public key to return: a key version's name followed by
  // `/publicKey`.
  string name = 1 [
    (google.api.field_behavior) = REQUIRED,
    (google.api.resource_reference).type = "kms.origincloudapis.eu/PublicKey"
  ];
}
