syntax = "proto3";

package origincloud.pvs.v1beta1;

import "google/api/annotations.proto";
import "google/api/client.proto";
import "google/api/field_behavior.proto";
import "google/api/field_info.proto";
import "google/api/resource.proto";
import "google/longrunning/operations.proto";
import "google/protobuf/field_mask.proto";
import "origincloud/longrunning/v1beta1/operations.proto";

// Block storage volumes: durable disks in one zone that an instance attaches
// to read and write.
service VolumeService {
  option (google.api.default_host) = "pvs.origincloudapis.eu";

  // Returns a volume.
  rpc GetVolume(GetVolumeRequest) returns (Volume) {
    option (google.api.http) = {get: "/v1beta1/{name=projects/*/zones/*/volumes/*}"};
    option (google.api.method_signature) = "name";
  }

  // Lists the volumes in a zone, oldest first. Deleted volumes aren't
  // listed.
  rpc ListVolumes(ListVolumesRequest) returns (ListVolumesResponse) {
    option (google.api.http) = {get: "/v1beta1/{parent=projects/*/zones/*}/volumes"};
    option (google.api.method_signature) = "parent";
  }

  // Creates a volume, empty or as a copy of a snapshot. The operation is
  // done once the volume is `AVAILABLE`, or failed once it is `ERROR`.
  rpc CreateVolume(CreateVolumeRequest) returns (google.longrunning.Operation) {
    option (google.api.http) = {
      post: "/v1beta1/{parent=projects/*/zones/*}/volumes"
      body: "volume"
    };
    option (google.api.method_signature) = "parent,volume";
    option (google.longrunning.operation_info) = {
      response_type: "Volume"
      metadata_type: "origincloud.longrunning.v1beta1.OperationMetadata"
    };
  }

  // Creates a volume whose initial content is a disk image the platform
  // downloads. The operation is done once the volume is `AVAILABLE`.
  //
  // (-- api-linter: core::0136::response-message-name=disabled
  //     aip.dev/not-precedent: it creates a volume, so it answers with the volume, as a create does. --)
  rpc ImportVolume(ImportVolumeRequest) returns (google.longrunning.Operation) {
    option (google.api.http) = {
      post: "/v1beta1/{parent=projects/*/zones/*}/volumes:import"
      body: "*"
    };
    option (google.longrunning.operation_info) = {
      response_type: "Volume"
      metadata_type: "origincloud.longrunning.v1beta1.OperationMetadata"
    };
  }

  // Changes a volume's size or tags. A larger `size_gib` grows the volume,
  // attached or not; it never shrinks, and the size it already has changes
  // nothing. The operation is done once the volume reports the new size.
  rpc UpdateVolume(UpdateVolumeRequest) returns (google.longrunning.Operation) {
    option (google.api.http) = {
      patch: "/v1beta1/{volume.name=projects/*/zones/*/volumes/*}"
      body: "volume"
    };
    option (google.api.method_signature) = "volume,update_mask";
    option (google.longrunning.operation_info) = {
      response_type: "Volume"
      metadata_type: "origincloud.longrunning.v1beta1.OperationMetadata"
    };
  }

  // Deletes a volume. It must not be attached, and none of its snapshots
  // may be left. The operation is done once the volume is `DELETED`.
  rpc DeleteVolume(DeleteVolumeRequest) returns (google.longrunning.Operation) {
    option (google.api.http) = {delete: "/v1beta1/{name=projects/*/zones/*/volumes/*}"};
    option (google.api.method_signature) = "name";
    option (google.longrunning.operation_info) = {
      response_type: "google.protobuf.Empty"
      metadata_type: "origincloud.longrunning.v1beta1.OperationMetadata"
    };
  }
}

// A block storage volume in one zone.
message Volume {
  option (google.api.resource) = {
    type: "pvs.origincloudapis.eu/Volume"
    pattern: "projects/{project}/zones/{zone}/volumes/{volume}"
    plural: "volumes"
    singular: "volume"
  };

  // Where the volume is in its lifecycle.
  enum State {
    // Not set.
    STATE_UNSPECIFIED = 0;
    // Being created.
    CREATING = 1;
    // Ready to attach.
    AVAILABLE = 2;
    // Attached to an instance.
    IN_USE = 3;
    // Being deleted.
    DELETING = 4;
    // Deleted. Readable by name for a day, never listed.
    DELETED = 5;
    // Its storage couldn't be created or removed; `state_reason` says
    // which. It can be deleted again.
    ERROR = 6;
  }

  // Where a resize is.
  enum ResizeState {
    // Not set.
    RESIZE_STATE_UNSPECIFIED = 0;
    // No resize is under way; the last one, if any, finished.
    RESIZE_COMPLETED = 1;
    // Growing to `pending_size_gib`.
    RESIZING = 2;
    // The last resize failed; `resize_reason` says why. The volume and its
    // data are unaffected.
    RESIZE_FAILED = 3;
  }

  // The volume's resource name.
  string name = 1 [(google.api.field_behavior) = IDENTIFIER];

  // The volume's URN, the identifier access policies and the audit log
  // use.
  string urn = 2 [(google.api.field_behavior) = OUTPUT_ONLY];

  // The size in GiB, at least 1. Growing it resizes the volume; it never
  // shrinks.
  int32 size_gib = 3 [(google.api.field_behavior) = REQUIRED];

  // The storage class, `storageClasses/{storage_class}`. The default class
  // when left empty.
  string storage_class = 4 [
    (google.api.field_behavior) = IMMUTABLE,
    (google.api.field_behavior) = OPTIONAL,
    (google.api.resource_reference).type = "pvs.origincloudapis.eu/StorageClass"
  ];

  // The snapshot the volume was created from, in the same project and
  // zone; empty for an empty volume. The volume is at least the snapshot's
  // size.
  string source_snapshot = 5 [
    (google.api.field_behavior) = IMMUTABLE,
    (google.api.field_behavior) = OPTIONAL,
    (google.api.resource_reference).type = "pvs.origincloudapis.eu/Snapshot"
  ];

  // Where the volume is in its lifecycle.
  State state = 6 [(google.api.field_behavior) = OUTPUT_ONLY];

  // Why the volume is in `ERROR`; empty otherwise.
  string state_reason = 7 [(google.api.field_behavior) = OUTPUT_ONLY];

  // When `state` is `IN_USE`, the id of the volume attachment holding it.
  string attachment = 8 [(google.api.field_behavior) = OUTPUT_ONLY];

  // Where the last resize is.
  ResizeState resize_state = 9 [(google.api.field_behavior) = OUTPUT_ONLY];

  // Why the last resize failed, when `resize_state` is `RESIZE_FAILED`.
  string resize_reason = 10 [(google.api.field_behavior) = OUTPUT_ONLY];

  // The size a resize under way is heading for; 0 when none is.
  // `size_gib` changes once the resize is confirmed.
  int32 pending_size_gib = 11 [(google.api.field_behavior) = OUTPUT_ONLY];

  // Why the volume is still here after the instance it was created with
  // was terminated; empty in every other case. Most often a snapshot of it
  // exists, and a snapshot depends on its volume's data.
  string retention_note = 12 [(google.api.field_behavior) = OUTPUT_ONLY];

  // The most I/O operations per second the volume serves, reads and writes
  // combined: a ceiling, not a guaranteed rate. 0 when it isn't limited.
  int32 iops = 13 [(google.api.field_behavior) = OUTPUT_ONLY];

  // The most MiB per second the volume transfers, reads and writes
  // combined: a ceiling, not a guaranteed rate. 0 when it isn't limited.
  int32 throughput_mibps = 14 [(google.api.field_behavior) = OUTPUT_ONLY];

  // The principal that created the volume, such as `user:<id>` or
  // `service_account:<id>`.
  string creator = 15 [(google.api.field_behavior) = OUTPUT_ONLY];

  // Labels of your own, at most 50. The `origin:name` tag is the name the
  // console shows.
  map<string, string> tags = 16 [(google.api.field_behavior) = OPTIONAL];
}

// The request for GetVolume.
message GetVolumeRequest {
  // The volume to return.
  string name = 1 [
    (google.api.field_behavior) = REQUIRED,
    (google.api.resource_reference).type = "pvs.origincloudapis.eu/Volume"
  ];
}

// The request for ListVolumes.
message ListVolumesRequest {
  // The zone whose volumes to list, `projects/{project}/zones/{zone}`.
  string parent = 1 [
    (google.api.field_behavior) = REQUIRED,
    (google.api.resource_reference).child_type = "pvs.origincloudapis.eu/Volume"
  ];

  // The most volumes to return; the server clamps it, and 0 means its
  // default.
  int32 page_size = 2 [(google.api.field_behavior) = OPTIONAL];

  // A previous response's `next_page_token`, for the page after it.
  string page_token = 3 [(google.api.field_behavior) = OPTIONAL];
}

// The response for ListVolumes.
message ListVolumesResponse {
  // The volumes on this page.
  repeated Volume volumes = 1;

  // The token for the next page; empty on the last one.
  string next_page_token = 2;
}

// The request for CreateVolume.
message CreateVolumeRequest {
  // The zone to create the volume in, `projects/{project}/zones/{zone}`.
  string parent = 1 [
    (google.api.field_behavior) = REQUIRED,
    (google.api.resource_reference).child_type = "pvs.origincloudapis.eu/Volume"
  ];

  // The volume to create: its size, and optionally its storage class,
  // source snapshot and tags.
  Volume volume = 2 [(google.api.field_behavior) = REQUIRED];

  // A UUID; a repeat with the same id returns the first request's
  // operation instead of creating a second volume.
  string request_id = 3 [
    (google.api.field_info).format = UUID4,
    (google.api.field_behavior) = OPTIONAL
  ];
}

// The request for ImportVolume.
message ImportVolumeRequest {
  // The zone to create the volume in, `projects/{project}/zones/{zone}`.
  string parent = 1 [
    (google.api.field_behavior) = REQUIRED,
    (google.api.resource_reference).child_type = "pvs.origincloudapis.eu/Volume"
  ];

  // The volume to create: its size, which must hold the image, and
  // optionally its storage class and tags.
  Volume volume = 2 [(google.api.field_behavior) = REQUIRED];

  // The URL of the disk image, which the platform downloads over HTTP or
  // HTTPS: it must be reachable from the platform.
  string source_url = 3 [(google.api.field_behavior) = REQUIRED];

  // A UUID; a repeat with the same id returns the first request's
  // operation instead of importing twice.
  string request_id = 4 [
    (google.api.field_info).format = UUID4,
    (google.api.field_behavior) = OPTIONAL
  ];
}

// The request for UpdateVolume.
message UpdateVolumeRequest {
  // The volume, by its name, with the fields to change.
  Volume volume = 1 [(google.api.field_behavior) = REQUIRED];

  // The fields to change: `size_gib`, `tags`, or both. `*` is both.
  google.protobuf.FieldMask update_mask = 2 [(google.api.field_behavior) = REQUIRED];

  // A UUID; a repeat with the same id returns the first request's
  // operation instead of changing the volume again.
  string request_id = 3 [
    (google.api.field_info).format = UUID4,
    (google.api.field_behavior) = OPTIONAL
  ];
}

// The request for DeleteVolume.
message DeleteVolumeRequest {
  // The volume to delete.
  string name = 1 [
    (google.api.field_behavior) = REQUIRED,
    (google.api.resource_reference).type = "pvs.origincloudapis.eu/Volume"
  ];

  // A UUID; a repeat with the same id returns the first request's
  // operation.
  string request_id = 2 [
    (google.api.field_info).format = UUID4,
    (google.api.field_behavior) = OPTIONAL
  ];
}
