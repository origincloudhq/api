syntax = "proto3";

package origincloud.pvs.v1beta1;

import "google/api/annotations.proto";
import "google/api/client.proto";
import "google/api/field_behavior.proto";
import "google/api/field_info.proto";
import "google/api/resource.proto";
import "google/longrunning/operations.proto";
import "google/protobuf/field_mask.proto";
import "origincloud/longrunning/v1beta1/operations.proto";

// Snapshots: point-in-time copies of a volume, in the volume's zone. A
// protected, completed snapshot is the source of new volumes and images.
service SnapshotService {
  option (google.api.default_host) = "pvs.origincloudapis.eu";

  // Returns a snapshot.
  rpc GetSnapshot(GetSnapshotRequest) returns (Snapshot) {
    option (google.api.http) = {get: "/v1beta1/{name=projects/*/zones/*/snapshots/*}"};
    option (google.api.method_signature) = "name";
  }

  // Lists the snapshots in a zone, oldest first. Deleted snapshots aren't
  // listed.
  rpc ListSnapshots(ListSnapshotsRequest) returns (ListSnapshotsResponse) {
    option (google.api.http) = {get: "/v1beta1/{parent=projects/*/zones/*}/snapshots"};
    option (google.api.method_signature) = "parent";
  }

  // Takes a snapshot of a volume. The operation is done once the copy is
  // `COMPLETED`, or failed once it is `ERROR`.
  rpc CreateSnapshot(CreateSnapshotRequest) returns (google.longrunning.Operation) {
    option (google.api.http) = {
      post: "/v1beta1/{parent=projects/*/zones/*}/snapshots"
      body: "snapshot"
    };
    option (google.api.method_signature) = "parent,snapshot";
    option (google.longrunning.operation_info) = {
      response_type: "Snapshot"
      metadata_type: "origincloud.longrunning.v1beta1.OperationMetadata"
    };
  }

  // Changes a snapshot's tags.
  rpc UpdateSnapshot(UpdateSnapshotRequest) returns (Snapshot) {
    option (google.api.http) = {
      patch: "/v1beta1/{snapshot.name=projects/*/zones/*/snapshots/*}"
      body: "snapshot"
    };
    option (google.api.method_signature) = "snapshot,update_mask";
  }

  // Deletes a snapshot. It must be `COMPLETED` or `ERROR`, and unprotected.
  // The operation is done once the snapshot is `DELETED`.
  rpc DeleteSnapshot(DeleteSnapshotRequest) returns (google.longrunning.Operation) {
    option (google.api.http) = {delete: "/v1beta1/{name=projects/*/zones/*/snapshots/*}"};
    option (google.api.method_signature) = "name";
    option (google.longrunning.operation_info) = {
      response_type: "google.protobuf.Empty"
      metadata_type: "origincloud.longrunning.v1beta1.OperationMetadata"
    };
  }

  // Protects a snapshot, so it can be the source of volumes and images and
  // can't be deleted. The operation is done once it is `PROTECTED`.
  rpc ProtectSnapshot(ProtectSnapshotRequest) returns (google.longrunning.Operation) {
    option (google.api.http) = {
      post: "/v1beta1/{name=projects/*/zones/*/snapshots/*}:protect"
      body: "*"
    };
    option (google.api.method_signature) = "name";
    option (google.longrunning.operation_info) = {
      response_type: "Snapshot"
      metadata_type: "origincloud.longrunning.v1beta1.OperationMetadata"
    };
  }

  // Unprotects a snapshot, so it can be deleted. Refused with
  // `FAILED_PRECONDITION` while an image is built from it or a volume not
  // `DELETED` was created from it; delete those first. The operation is
  // done once it is `UNPROTECTED`.
  rpc UnprotectSnapshot(UnprotectSnapshotRequest) returns (google.longrunning.Operation) {
    option (google.api.http) = {
      post: "/v1beta1/{name=projects/*/zones/*/snapshots/*}:unprotect"
      body: "*"
    };
    option (google.api.method_signature) = "name";
    option (google.longrunning.operation_info) = {
      response_type: "Snapshot"
      metadata_type: "origincloud.longrunning.v1beta1.OperationMetadata"
    };
  }
}

// A point-in-time copy of a volume.
message Snapshot {
  option (google.api.resource) = {
    type: "pvs.origincloudapis.eu/Snapshot"
    pattern: "projects/{project}/zones/{zone}/snapshots/{snapshot}"
    plural: "snapshots"
    singular: "snapshot"
  };

  // Where the copy is.
  enum State {
    // Not set.
    STATE_UNSPECIFIED = 0;
    // Being copied.
    PENDING = 1;
    // Copied.
    COMPLETED = 2;
    // Being deleted.
    DELETING = 3;
    // Deleted. Readable by name for a day, never listed.
    DELETED = 4;
    // The copy or its removal failed; `state_reason` says which. There is
    // no usable copy behind it: delete it.
    ERROR = 5;
  }

  // Whether the snapshot is protected, independently of `state`.
  enum ProtectionState {
    // Not set.
    PROTECTION_STATE_UNSPECIFIED = 0;
    // Not protected: it can be deleted, and is no source.
    UNPROTECTED = 1;
    // Becoming protected.
    PROTECTING = 2;
    // Protected: a source of volumes and images, and can't be deleted.
    PROTECTED = 3;
    // Becoming unprotected.
    UNPROTECTING = 4;
    // The last change couldn't be applied; `protection_reason` says why.
    // Protect or unprotect it again.
    PROTECTION_FAILED = 5;
  }

  // The snapshot's resource name.
  string name = 1 [(google.api.field_behavior) = IDENTIFIER];

  // The snapshot's URN, the identifier access policies and the audit log
  // use.
  string urn = 2 [(google.api.field_behavior) = OUTPUT_ONLY];

  // The volume copied, in the same project and zone.
  string source_volume = 3 [
    (google.api.field_behavior) = REQUIRED,
    (google.api.field_behavior) = IMMUTABLE,
    (google.api.resource_reference).type = "pvs.origincloudapis.eu/Volume"
  ];

  // The source volume's size in GiB when it was copied: the least a volume
  // created from the snapshot holds.
  int32 source_size_gib = 4 [(google.api.field_behavior) = OUTPUT_ONLY];

  // Where the copy is.
  State state = 5 [(google.api.field_behavior) = OUTPUT_ONLY];

  // Why the snapshot is in `ERROR`; empty otherwise.
  string state_reason = 6 [(google.api.field_behavior) = OUTPUT_ONLY];

  // Whether it is protected.
  ProtectionState protection_state = 7 [(google.api.field_behavior) = OUTPUT_ONLY];

  // Why the last protection change failed, when `protection_state` is
  // `PROTECTION_FAILED`.
  string protection_reason = 8 [(google.api.field_behavior) = OUTPUT_ONLY];

  // The principal that took the snapshot, such as `user:<id>` or
  // `service_account:<id>`.
  string creator = 10 [(google.api.field_behavior) = OUTPUT_ONLY];

  // Labels of your own, at most 50. The `origin:name` tag is the name the
  // console shows.
  map<string, string> tags = 11 [(google.api.field_behavior) = OPTIONAL];
}

// The request for GetSnapshot.
message GetSnapshotRequest {
  // The snapshot to return.
  string name = 1 [
    (google.api.field_behavior) = REQUIRED,
    (google.api.resource_reference).type = "pvs.origincloudapis.eu/Snapshot"
  ];
}

// The request for ListSnapshots.
message ListSnapshotsRequest {
  // The zone whose snapshots to list, `projects/{project}/zones/{zone}`.
  string parent = 1 [
    (google.api.field_behavior) = REQUIRED,
    (google.api.resource_reference).child_type = "pvs.origincloudapis.eu/Snapshot"
  ];

  // The most snapshots to return; the server clamps it, and 0 means its
  // default.
  int32 page_size = 2 [(google.api.field_behavior) = OPTIONAL];

  // A previous response's `next_page_token`, for the page after it.
  string page_token = 3 [(google.api.field_behavior) = OPTIONAL];
}

// The response for ListSnapshots.
message ListSnapshotsResponse {
  // The snapshots on this page.
  repeated Snapshot snapshots = 1;

  // The token for the next page; empty on the last one.
  string next_page_token = 2;
}

// The request for CreateSnapshot.
message CreateSnapshotRequest {
  // The zone of the volume to copy, `projects/{project}/zones/{zone}`.
  string parent = 1 [
    (google.api.field_behavior) = REQUIRED,
    (google.api.resource_reference).child_type = "pvs.origincloudapis.eu/Snapshot"
  ];

  // The snapshot to take: its source volume, and optionally its tags.
  Snapshot snapshot = 2 [(google.api.field_behavior) = REQUIRED];

  // A UUID; a repeat with the same id returns the first request's
  // operation instead of taking a second snapshot.
  string request_id = 3 [
    (google.api.field_info).format = UUID4,
    (google.api.field_behavior) = OPTIONAL
  ];
}

// The request for UpdateSnapshot.
message UpdateSnapshotRequest {
  // The snapshot, by its name, with the tags to set.
  Snapshot snapshot = 1 [(google.api.field_behavior) = REQUIRED];

  // The fields to change: `tags`, the only field that changes. `*` is the
  // same.
  google.protobuf.FieldMask update_mask = 2 [(google.api.field_behavior) = REQUIRED];
}

// The request for DeleteSnapshot.
message DeleteSnapshotRequest {
  // The snapshot to delete.
  string name = 1 [
    (google.api.field_behavior) = REQUIRED,
    (google.api.resource_reference).type = "pvs.origincloudapis.eu/Snapshot"
  ];

  // A UUID; a repeat with the same id returns the first request's
  // operation.
  string request_id = 2 [
    (google.api.field_info).format = UUID4,
    (google.api.field_behavior) = OPTIONAL
  ];
}

// The request for ProtectSnapshot.
message ProtectSnapshotRequest {
  // The snapshot to protect; it must be `COMPLETED`.
  string name = 1 [
    (google.api.field_behavior) = REQUIRED,
    (google.api.resource_reference).type = "pvs.origincloudapis.eu/Snapshot"
  ];

  // A UUID; a repeat with the same id returns the first request's
  // operation.
  string request_id = 2 [
    (google.api.field_info).format = UUID4,
    (google.api.field_behavior) = OPTIONAL
  ];
}

// The request for UnprotectSnapshot.
message UnprotectSnapshotRequest {
  // The snapshot to unprotect; it must be `COMPLETED`, or `ERROR` so that
  // it can then be deleted.
  string name = 1 [
    (google.api.field_behavior) = REQUIRED,
    (google.api.resource_reference).type = "pvs.origincloudapis.eu/Snapshot"
  ];

  // A UUID; a repeat with the same id returns the first request's
  // operation.
  string request_id = 2 [
    (google.api.field_info).format = UUID4,
    (google.api.field_behavior) = OPTIONAL
  ];
}
