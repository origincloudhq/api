syntax = "proto3";

package origincloud.sts.v1beta1;

import "google/api/annotations.proto";
import "google/api/client.proto";
import "google/api/field_behavior.proto";
import "google/api/resource.proto";
import "google/protobuf/duration.proto";
import "google/protobuf/timestamp.proto";

// The security token service: it turns a token from an identity provider
// outside Origin Cloud, such as a CI job's OIDC token, into the access token
// of a `WORKLOAD` service account that trusts it through a federated
// credential. It authenticates no caller: the token is the proof.
service SecurityTokenService {
  option (google.api.default_host) = "sts.origincloudapis.eu";

  // Assumes a `WORKLOAD` service account with an OIDC token. Exactly one
  // federated credential, of the named service account or of any, must
  // trust the token: its issuer and audience, and every one of its
  // conditions. The token is verified with its issuer's published keys
  // (RS256), and a pull request's job is admitted only by a credential that
  // names its `event_name`. Refused with `PERMISSION_DENIED` when the token
  // isn't trusted, without saying why, and with `UNAVAILABLE` when its
  // issuer or the trust can't be read now.
  rpc AssumeServiceAccount(AssumeServiceAccountRequest) returns (AssumeServiceAccountResponse) {
    option (google.api.http) = {
      post: "/v1beta1:assumeServiceAccount"
      body: "*"
    };
  }
}

// The request of `AssumeServiceAccount`.
message AssumeServiceAccountRequest {
  // The OIDC token, a JWT its issuer signed, such as a CI job's.
  string token = 1 [(google.api.field_behavior) = REQUIRED];

  // The service account to assume,
  // `organizations/{organization}/serviceAccounts/{service_account}`. Only
  // its federated credentials are considered. Without it, any service
  // account's credential that trusts the token is.
  string service_account = 2 [
    (google.api.field_behavior) = OPTIONAL,
    (google.api.resource_reference).type = "iam.origincloudapis.eu/ServiceAccount"
  ];

  // How long the access token lives: from 60 seconds to 1 hour, 15 minutes
  // when unset.
  google.protobuf.Duration lifetime = 3 [(google.api.field_behavior) = OPTIONAL];
}

// The response of `AssumeServiceAccount`.
message AssumeServiceAccountResponse {
  // The service account's access token, sent as `Authorization: Bearer
  // <access_token>`.
  string access_token = 1;

  // When the access token expires.
  google.protobuf.Timestamp expire_time = 2;

  // The service account assumed,
  // `organizations/{organization}/serviceAccounts/{service_account}`.
  string service_account = 3 [(google.api.resource_reference).type = "iam.origincloudapis.eu/ServiceAccount"];

  // The federated credential that trusted the token.
  string federated_credential = 4 [(google.api.resource_reference).type = "iam.origincloudapis.eu/FederatedCredential"];
}
