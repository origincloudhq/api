syntax = "proto3";

package origincloud.network.v1beta1;

import "google/api/annotations.proto";
import "google/api/client.proto";
import "google/api/field_behavior.proto";
import "google/api/field_info.proto";
import "google/api/resource.proto";
import "google/longrunning/operations.proto";
import "google/protobuf/field_mask.proto";
import "google/protobuf/timestamp.proto";
import "origincloud/longrunning/v1beta1/operations.proto";

// Route tables: where a subnet's traffic leaves the VPC. A table holds
// routes (`RouteService`), and applies to the subnets that a route table
// association names it for (`RouteTableAssociationService`).
service RouteTableService {
  option (google.api.default_host) = "network.origincloudapis.eu";

  // Returns a route table.
  rpc GetRouteTable(GetRouteTableRequest) returns (RouteTable) {
    option (google.api.http) = {get: "/v1beta1/{name=projects/*/regions/*/routeTables/*}"};
    option (google.api.method_signature) = "name";
  }

  // Lists the route tables in a region, oldest first.
  rpc ListRouteTables(ListRouteTablesRequest) returns (ListRouteTablesResponse) {
    option (google.api.http) = {get: "/v1beta1/{parent=projects/*/regions/*}/routeTables"};
    option (google.api.method_signature) = "parent";
  }

  // Creates a route table in a VPC, with the VPC's local routes and no
  // other. The operation is done once the route table is recorded.
  rpc CreateRouteTable(CreateRouteTableRequest) returns (google.longrunning.Operation) {
    option (google.api.http) = {
      post: "/v1beta1/{parent=projects/*/regions/*}/routeTables"
      body: "route_table"
    };
    option (google.api.method_signature) = "parent,route_table";
    option (google.longrunning.operation_info) = {
      response_type: "RouteTable"
      metadata_type: "origincloud.longrunning.v1beta1.OperationMetadata"
    };
  }

  // Changes a route table's tags. The operation is done once the change is
  // recorded.
  rpc UpdateRouteTable(UpdateRouteTableRequest) returns (google.longrunning.Operation) {
    option (google.api.http) = {
      patch: "/v1beta1/{route_table.name=projects/*/regions/*/routeTables/*}"
      body: "route_table"
    };
    option (google.api.method_signature) = "route_table,update_mask";
    option (google.longrunning.operation_info) = {
      response_type: "RouteTable"
      metadata_type: "origincloud.longrunning.v1beta1.OperationMetadata"
    };
  }

  // Deletes a route table with its routes. Refused for a main route table,
  // which goes with its VPC, and while a route table association names
  // the table. The operation is done once the change is recorded; the
  // network applies it within seconds.
  rpc DeleteRouteTable(DeleteRouteTableRequest) returns (google.longrunning.Operation) {
    option (google.api.http) = {delete: "/v1beta1/{name=projects/*/regions/*/routeTables/*}"};
    option (google.api.method_signature) = "name";
    option (google.longrunning.operation_info) = {
      response_type: "google.protobuf.Empty"
      metadata_type: "origincloud.longrunning.v1beta1.OperationMetadata"
    };
  }
}

// Routes out of a VPC for the subnets associated with the table.
message RouteTable {
  option (google.api.resource) = {
    type: "network.origincloudapis.eu/RouteTable"
    pattern: "projects/{project}/regions/{region}/routeTables/{route_table}"
    plural: "routeTables"
    singular: "routeTable"
  };

  // The route table's resource name.
  string name = 1 [(google.api.field_behavior) = IDENTIFIER];

  // The route table's URN, the identifier access policies and the audit
  // log use.
  string urn = 2 [(google.api.field_behavior) = OUTPUT_ONLY];

  // The VPC the table routes for, in the same project and region.
  string vpc = 3 [
    (google.api.field_behavior) = REQUIRED,
    (google.api.field_behavior) = IMMUTABLE,
    (google.api.resource_reference).type = "network.origincloudapis.eu/Vpc"
  ];

  // Whether the platform created the table with the VPC, as its main route
  // table. Only the project's default VPC has such resources. It can't be
  // deleted, and goes with its VPC. Like any other table, it routes only
  // for the subnets a route table association names it for.
  bool main = 4 [(google.api.field_behavior) = OUTPUT_ONLY];

  // The VPC's own ranges, which every table reaches directly. Traffic
  // within the VPC never needs a route.
  repeated string local_routes = 5 [(google.api.field_behavior) = OUTPUT_ONLY];

  // When the route table was created.
  google.protobuf.Timestamp create_time = 6 [(google.api.field_behavior) = OUTPUT_ONLY];

  // The principal that created the route table, such as `user:<id>` or
  // `service_account:<id>`; empty for one the platform created.
  string creator = 7 [(google.api.field_behavior) = OUTPUT_ONLY];

  // Labels of your own, at most 50. The `origin:name` tag is the name the
  // console shows.
  map<string, string> tags = 8 [(google.api.field_behavior) = OPTIONAL];
}

// The request for GetRouteTable.
message GetRouteTableRequest {
  // The route table to return.
  string name = 1 [
    (google.api.field_behavior) = REQUIRED,
    (google.api.resource_reference).type = "network.origincloudapis.eu/RouteTable"
  ];
}

// The request for ListRouteTables.
message ListRouteTablesRequest {
  // The region whose route tables to list,
  // `projects/{project}/regions/{region}`.
  string parent = 1 [
    (google.api.field_behavior) = REQUIRED,
    (google.api.resource_reference).child_type = "network.origincloudapis.eu/RouteTable"
  ];

  // The most route tables to return; the server clamps it, and 0 means
  // its default.
  int32 page_size = 2 [(google.api.field_behavior) = OPTIONAL];

  // A previous response's `next_page_token`, for the page after it.
  string page_token = 3 [(google.api.field_behavior) = OPTIONAL];

  // Only the route tables of this VPC, when set.
  //
  // (-- api-linter: core::0132::request-unknown-fields=disabled
  //     aip.dev/not-precedent: a list is narrowed by typed fields, not a filter string. --)
  string vpc = 4 [
    (google.api.field_behavior) = OPTIONAL,
    (google.api.resource_reference).type = "network.origincloudapis.eu/Vpc"
  ];
}

// The response for ListRouteTables.
message ListRouteTablesResponse {
  // The route tables on this page.
  repeated RouteTable route_tables = 1;

  // The token for the next page; empty on the last one.
  string next_page_token = 2;
}

// The request for CreateRouteTable.
message CreateRouteTableRequest {
  // The region to create the route table in,
  // `projects/{project}/regions/{region}`.
  string parent = 1 [
    (google.api.field_behavior) = REQUIRED,
    (google.api.resource_reference).child_type = "network.origincloudapis.eu/RouteTable"
  ];

  // The route table to create: its VPC, and optionally its tags.
  RouteTable route_table = 2 [(google.api.field_behavior) = REQUIRED];

  // A UUID; a repeat with the same id returns the first request's
  // operation instead of creating a second route table.
  string request_id = 3 [
    (google.api.field_info).format = UUID4,
    (google.api.field_behavior) = OPTIONAL
  ];
}

// The request for UpdateRouteTable.
message UpdateRouteTableRequest {
  // The route table, by its name, with the fields to change.
  RouteTable route_table = 1 [(google.api.field_behavior) = REQUIRED];

  // The fields to change: `tags`, or `*`.
  google.protobuf.FieldMask update_mask = 2 [(google.api.field_behavior) = REQUIRED];

  // A UUID; a repeat with the same id returns the first request's
  // operation instead of changing the route table again.
  string request_id = 3 [
    (google.api.field_info).format = UUID4,
    (google.api.field_behavior) = OPTIONAL
  ];
}

// The request for DeleteRouteTable.
message DeleteRouteTableRequest {
  // The route table to delete.
  string name = 1 [
    (google.api.field_behavior) = REQUIRED,
    (google.api.resource_reference).type = "network.origincloudapis.eu/RouteTable"
  ];

  // A UUID; a repeat with the same id returns the first request's
  // operation.
  string request_id = 2 [
    (google.api.field_info).format = UUID4,
    (google.api.field_behavior) = OPTIONAL
  ];
}
