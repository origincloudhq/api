syntax = "proto3";

package origincloud.network.v1beta1;

import "google/api/annotations.proto";
import "google/api/client.proto";
import "google/api/field_behavior.proto";
import "google/api/field_info.proto";
import "google/api/resource.proto";
import "google/longrunning/operations.proto";
import "google/protobuf/field_mask.proto";
import "google/protobuf/timestamp.proto";
import "origincloud/longrunning/v1beta1/operations.proto";

// Floating IPs: public IPv4 addresses of your own in one zone, kept until
// released. Associated with a network interface
// (`FloatingIpAssociationService`), the address reaches the interface's
// private IPv4 address both ways (static 1:1 NAT). The interface's subnet
// reaches, and is reached from, the internet over IPv4 only if its own
// route table has the IPv4 default route (see the subnet's `route_table`).
service FloatingIpService {
  option (google.api.default_host) = "network.origincloudapis.eu";

  // Returns a floating IP.
  rpc GetFloatingIp(GetFloatingIpRequest) returns (FloatingIp) {
    option (google.api.http) = {get: "/v1beta1/{name=projects/*/zones/*/floatingIps/*}"};
    option (google.api.method_signature) = "name";
  }

  // Lists the floating IPs in a zone, oldest first, those the platform
  // assigned at launch included.
  rpc ListFloatingIps(ListFloatingIpsRequest) returns (ListFloatingIpsResponse) {
    option (google.api.http) = {get: "/v1beta1/{parent=projects/*/zones/*}/floatingIps"};
    option (google.api.method_signature) = "parent";
  }

  // Allocates a floating IP from the zone's public addresses, associated
  // with nothing. The operation is done once the address is recorded as
  // yours.
  rpc CreateFloatingIp(CreateFloatingIpRequest) returns (google.longrunning.Operation) {
    option (google.api.http) = {
      post: "/v1beta1/{parent=projects/*/zones/*}/floatingIps"
      body: "floating_ip"
    };
    option (google.api.method_signature) = "parent,floating_ip";
    option (google.longrunning.operation_info) = {
      response_type: "FloatingIp"
      metadata_type: "origincloud.longrunning.v1beta1.OperationMetadata"
    };
  }

  // Changes a floating IP's tags. The operation is done once the change is
  // recorded.
  rpc UpdateFloatingIp(UpdateFloatingIpRequest) returns (google.longrunning.Operation) {
    option (google.api.http) = {
      patch: "/v1beta1/{floating_ip.name=projects/*/zones/*/floatingIps/*}"
      body: "floating_ip"
    };
    option (google.api.method_signature) = "floating_ip,update_mask";
    option (google.longrunning.operation_info) = {
      response_type: "FloatingIp"
      metadata_type: "origincloud.longrunning.v1beta1.OperationMetadata"
    };
  }

  // Releases a floating IP: its address goes back to the zone. Refused
  // while it is associated with a network interface or a NAT gateway uses
  // it. The operation is done once the change is recorded.
  rpc DeleteFloatingIp(DeleteFloatingIpRequest) returns (google.longrunning.Operation) {
    option (google.api.http) = {delete: "/v1beta1/{name=projects/*/zones/*/floatingIps/*}"};
    option (google.api.method_signature) = "name";
    option (google.longrunning.operation_info) = {
      response_type: "google.protobuf.Empty"
      metadata_type: "origincloud.longrunning.v1beta1.OperationMetadata"
    };
  }
}

// A public IPv4 address of your own.
message FloatingIp {
  option (google.api.resource) = {
    type: "network.origincloudapis.eu/FloatingIp"
    pattern: "projects/{project}/zones/{zone}/floatingIps/{floating_ip}"
    plural: "floatingIps"
    singular: "floatingIp"
  };

  // The floating IP's resource name.
  string name = 1 [(google.api.field_behavior) = IDENTIFIER];

  // The floating IP's URN, the identifier access policies and the audit
  // log use.
  string urn = 2 [(google.api.field_behavior) = OUTPUT_ONLY];

  // The public address.
  string address = 3 [
    (google.api.field_info).format = IPV4,
    (google.api.field_behavior) = OUTPUT_ONLY
  ];

  // The network interface the address reaches, as the floating IP's
  // association (a `FloatingIpAssociation`) sets it; empty while it has
  // none.
  string network_interface = 4 [
    (google.api.field_behavior) = OUTPUT_ONLY,
    (google.api.resource_reference).type = "network.origincloudapis.eu/NetworkInterface"
  ];

  // The interface's private IPv4 address the public one translates to, as
  // the floating IP's association sets it; empty while it has none.
  string private_address = 5 [
    (google.api.field_info).format = IPV4,
    (google.api.field_behavior) = OUTPUT_ONLY
  ];

  // Whether the platform assigned the address at launch, to an interface
  // the launch created in a subnet with `auto_assign_public_ip`. Such an
  // address is released when its instance is terminated.
  bool auto_assigned = 6 [(google.api.field_behavior) = OUTPUT_ONLY];

  // When the floating IP was created.
  google.protobuf.Timestamp create_time = 7 [(google.api.field_behavior) = OUTPUT_ONLY];

  // The principal that created the floating IP, such as `user:<id>` or
  // `service_account:<id>`; empty for one the platform created.
  string creator = 8 [(google.api.field_behavior) = OUTPUT_ONLY];

  // Labels of your own, at most 50. The `origin:name` tag is the name the
  // console shows.
  map<string, string> tags = 9 [(google.api.field_behavior) = OPTIONAL];
}

// The request for GetFloatingIp.
message GetFloatingIpRequest {
  // The floating IP to return.
  string name = 1 [
    (google.api.field_behavior) = REQUIRED,
    (google.api.resource_reference).type = "network.origincloudapis.eu/FloatingIp"
  ];
}

// The request for ListFloatingIps.
message ListFloatingIpsRequest {
  // The zone whose floating IPs to list, `projects/{project}/zones/{zone}`.
  string parent = 1 [
    (google.api.field_behavior) = REQUIRED,
    (google.api.resource_reference).child_type = "network.origincloudapis.eu/FloatingIp"
  ];

  // The most floating IPs to return; the server clamps it, and 0 means
  // its default.
  int32 page_size = 2 [(google.api.field_behavior) = OPTIONAL];

  // A previous response's `next_page_token`, for the page after it.
  string page_token = 3 [(google.api.field_behavior) = OPTIONAL];
}

// The response for ListFloatingIps.
message ListFloatingIpsResponse {
  // The floating IPs on this page.
  repeated FloatingIp floating_ips = 1;

  // The token for the next page; empty on the last one.
  string next_page_token = 2;
}

// The request for CreateFloatingIp.
message CreateFloatingIpRequest {
  // The zone to allocate the floating IP in,
  // `projects/{project}/zones/{zone}`.
  string parent = 1 [
    (google.api.field_behavior) = REQUIRED,
    (google.api.resource_reference).child_type = "network.origincloudapis.eu/FloatingIp"
  ];

  // The floating IP to allocate: optionally its tags.
  FloatingIp floating_ip = 2 [(google.api.field_behavior) = REQUIRED];

  // A UUID; a repeat with the same id returns the first request's
  // operation instead of allocating a second floating IP.
  string request_id = 3 [
    (google.api.field_info).format = UUID4,
    (google.api.field_behavior) = OPTIONAL
  ];
}

// The request for UpdateFloatingIp.
message UpdateFloatingIpRequest {
  // The floating IP, by its name, with the fields to change.
  FloatingIp floating_ip = 1 [(google.api.field_behavior) = REQUIRED];

  // The fields to change: `tags`, or `*`.
  google.protobuf.FieldMask update_mask = 2 [(google.api.field_behavior) = REQUIRED];

  // A UUID; a repeat with the same id returns the first request's
  // operation instead of changing the floating IP again.
  string request_id = 3 [
    (google.api.field_info).format = UUID4,
    (google.api.field_behavior) = OPTIONAL
  ];
}

// The request for DeleteFloatingIp.
message DeleteFloatingIpRequest {
  // The floating IP to release.
  string name = 1 [
    (google.api.field_behavior) = REQUIRED,
    (google.api.resource_reference).type = "network.origincloudapis.eu/FloatingIp"
  ];

  // A UUID; a repeat with the same id returns the first request's
  // operation.
  string request_id = 2 [
    (google.api.field_info).format = UUID4,
    (google.api.field_behavior) = OPTIONAL
  ];
}
