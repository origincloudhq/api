syntax = "proto3";

package origincloud.network.v1beta1;

import "google/api/annotations.proto";
import "google/api/client.proto";
import "google/api/field_behavior.proto";
import "google/api/field_info.proto";
import "google/api/resource.proto";
import "google/longrunning/operations.proto";
import "origincloud/longrunning/v1beta1/operations.proto";

// Security group rules: the traffic a security group allows, each rule to
// or from one peer. Rules only allow, so their order doesn't matter. A rule
// is immutable: it is created and deleted, never changed, so to change one,
// delete it and create its replacement. Creating the replacement first
// leaves no window in which neither rule allows the traffic.
service SecurityGroupRuleService {
  option (google.api.default_host) = "network.origincloudapis.eu";

  // Returns a security group rule.
  rpc GetSecurityGroupRule(GetSecurityGroupRuleRequest) returns (SecurityGroupRule) {
    option (google.api.http) = {get: "/v1beta1/{name=projects/*/regions/*/securityGroups/*/rules/*}"};
    option (google.api.method_signature) = "name";
  }

  // Lists a security group's rules of both directions, oldest first.
  rpc ListSecurityGroupRules(ListSecurityGroupRulesRequest) returns (ListSecurityGroupRulesResponse) {
    option (google.api.http) = {get: "/v1beta1/{parent=projects/*/regions/*/securityGroups/*}/rules"};
    option (google.api.method_signature) = "parent";
  }

  // Adds a rule to a security group. A rule identical to one the group
  // has in every field, `description` included, is refused with
  // `FAILED_PRECONDITION`. A group holds at most 120 rules by default, both
  // directions together, as the quota sets. The operation is done once the
  // change is recorded; the network applies it within seconds.
  rpc CreateSecurityGroupRule(CreateSecurityGroupRuleRequest) returns (google.longrunning.Operation) {
    option (google.api.http) = {
      post: "/v1beta1/{parent=projects/*/regions/*/securityGroups/*}/rules"
      body: "security_group_rule"
    };
    option (google.api.method_signature) = "parent,security_group_rule";
    option (google.longrunning.operation_info) = {
      response_type: "SecurityGroupRule"
      metadata_type: "origincloud.longrunning.v1beta1.OperationMetadata"
    };
  }

  // Removes a rule from its security group. The operation is done once the
  // change is recorded; the network applies it within seconds.
  rpc DeleteSecurityGroupRule(DeleteSecurityGroupRuleRequest) returns (google.longrunning.Operation) {
    option (google.api.http) = {delete: "/v1beta1/{name=projects/*/regions/*/securityGroups/*/rules/*}"};
    option (google.api.method_signature) = "name";
    option (google.longrunning.operation_info) = {
      response_type: "google.protobuf.Empty"
      metadata_type: "origincloud.longrunning.v1beta1.OperationMetadata"
    };
  }
}

// A security group rule: the traffic it allows in one direction, to or from
// one peer. Set exactly one of `cidr_block`, `peer_security_group` and
// `same_group`.
message SecurityGroupRule {
  option (google.api.resource) = {
    type: "network.origincloudapis.eu/SecurityGroupRule"
    pattern: "projects/{project}/regions/{region}/securityGroups/{security_group}/rules/{rule}"
    plural: "securityGroupRules"
    singular: "securityGroupRule"
  };

  // Which traffic a rule applies to.
  enum Direction {
    // Not set.
    DIRECTION_UNSPECIFIED = 0;
    // Traffic an interface in the group admits.
    INGRESS = 1;
    // Traffic an interface in the group sends.
    EGRESS = 2;
  }

  // The traffic a rule matches.
  enum Protocol {
    // Not set.
    PROTOCOL_UNSPECIFIED = 0;
    // Every protocol; ports don't apply.
    ALL = 1;
    // TCP.
    TCP = 2;
    // UDP.
    UDP = 3;
    // ICMP to and from IPv4 ranges, ICMPv6 to and from IPv6 ranges, every
    // type and code; ports don't apply.
    ICMP = 4;
  }

  // The rule's resource name.
  string name = 1 [(google.api.field_behavior) = IDENTIFIER];

  // Which traffic the rule applies to.
  Direction direction = 2 [
    (google.api.field_behavior) = REQUIRED,
    (google.api.field_behavior) = IMMUTABLE
  ];

  // The traffic the rule allows.
  Protocol protocol = 3 [
    (google.api.field_behavior) = REQUIRED,
    (google.api.field_behavior) = IMMUTABLE
  ];

  // The first port the rule matches, for `TCP` and `UDP`. Each set of
  // ports has one spelling, and the rule reads back in it: `first_port` 0
  // and `last_port` 0 match every port, a `last_port` of 0 the single port
  // `first_port`, and a `first_port` below `last_port` the range between
  // them. Any other spelling of a set is refused with `INVALID_ARGUMENT`
  // naming the one to use: `first_port` 22 and `last_port` 22 is
  // `first_port` 22 and `last_port` 0, and 0 or 1 to 65535 is 0 and 0.
  int32 first_port = 4 [
    (google.api.field_behavior) = IMMUTABLE,
    (google.api.field_behavior) = OPTIONAL
  ];

  // The last port the rule matches, above `first_port`; 0 for the single
  // port `first_port`, or with `first_port` 0 for every port.
  int32 last_port = 5 [
    (google.api.field_behavior) = IMMUTABLE,
    (google.api.field_behavior) = OPTIONAL
  ];

  // The peer as an address range: where admitted traffic comes from, or
  // where sent traffic goes to.
  string cidr_block = 6 [
    (google.api.field_behavior) = IMMUTABLE,
    (google.api.field_behavior) = OPTIONAL
  ];

  // The peer as another security group of the same VPC: its members'
  // addresses. The rule's own group is refused here with
  // `INVALID_ARGUMENT`: it is `same_group`.
  string peer_security_group = 7 [
    (google.api.field_behavior) = IMMUTABLE,
    (google.api.field_behavior) = OPTIONAL,
    (google.api.resource_reference).type = "network.origincloudapis.eu/SecurityGroup"
  ];

  // The peer as the rule's own group's members.
  bool same_group = 8 [
    (google.api.field_behavior) = IMMUTABLE,
    (google.api.field_behavior) = OPTIONAL
  ];

  // What the rule is for.
  string description = 9 [
    (google.api.field_behavior) = IMMUTABLE,
    (google.api.field_behavior) = OPTIONAL
  ];
}

// The request for GetSecurityGroupRule.
message GetSecurityGroupRuleRequest {
  // The rule to return.
  string name = 1 [
    (google.api.field_behavior) = REQUIRED,
    (google.api.resource_reference).type = "network.origincloudapis.eu/SecurityGroupRule"
  ];
}

// The request for ListSecurityGroupRules.
message ListSecurityGroupRulesRequest {
  // The security group whose rules to list,
  // `projects/{project}/regions/{region}/securityGroups/{security_group}`.
  string parent = 1 [
    (google.api.field_behavior) = REQUIRED,
    (google.api.resource_reference).child_type = "network.origincloudapis.eu/SecurityGroupRule"
  ];

  // The most rules to return; the server clamps it, and 0 means its
  // default.
  int32 page_size = 2 [(google.api.field_behavior) = OPTIONAL];

  // A previous response's `next_page_token`, for the page after it.
  string page_token = 3 [(google.api.field_behavior) = OPTIONAL];
}

// The response for ListSecurityGroupRules.
message ListSecurityGroupRulesResponse {
  // The rules on this page.
  repeated SecurityGroupRule security_group_rules = 1;

  // The token for the next page; empty on the last one.
  string next_page_token = 2;
}

// The request for CreateSecurityGroupRule.
message CreateSecurityGroupRuleRequest {
  // The security group to add the rule to,
  // `projects/{project}/regions/{region}/securityGroups/{security_group}`.
  string parent = 1 [
    (google.api.field_behavior) = REQUIRED,
    (google.api.resource_reference).child_type = "network.origincloudapis.eu/SecurityGroupRule"
  ];

  // The rule to add.
  SecurityGroupRule security_group_rule = 2 [(google.api.field_behavior) = REQUIRED];

  // A UUID; a repeat with the same id returns the first request's
  // operation instead of adding the rule again.
  string request_id = 3 [
    (google.api.field_info).format = UUID4,
    (google.api.field_behavior) = OPTIONAL
  ];
}

// The request for DeleteSecurityGroupRule.
message DeleteSecurityGroupRuleRequest {
  // The rule to remove.
  string name = 1 [
    (google.api.field_behavior) = REQUIRED,
    (google.api.resource_reference).type = "network.origincloudapis.eu/SecurityGroupRule"
  ];

  // A UUID; a repeat with the same id returns the first request's
  // operation.
  string request_id = 2 [
    (google.api.field_info).format = UUID4,
    (google.api.field_behavior) = OPTIONAL
  ];
}
