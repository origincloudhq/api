syntax = "proto3";

// VPCs, subnets, routing, gateways, floating IPs, network interfaces, security
// groups, ACLs and DNS policies.
//
// A VPC is a private network in one region of a project; its subnets, NAT
// gateways, floating IPs and network interfaces each live in one zone.
// Route tables say where a subnet's traffic leaves the VPC: through an
// internet gateway or a NAT gateway. Security groups allow traffic to and
// from the network interfaces associated with them, ACLs filter a subnet's
// traffic with stateless rules, and a DNS policy says how a VPC's resolver
// answers names outside the platform's own.
package origincloud.network.v1beta1;

import "google/api/annotations.proto";
import "google/api/client.proto";
import "google/api/field_behavior.proto";
import "google/api/field_info.proto";
import "google/api/resource.proto";
import "google/longrunning/operations.proto";
import "google/protobuf/field_mask.proto";
import "google/protobuf/timestamp.proto";
import "origincloud/longrunning/v1beta1/operations.proto";

// VPCs: private networks in a region, each with its own IPv4 and IPv6
// address space, isolated from every other VPC. A VPC is created empty: its
// subnets, security groups, ACLs, route tables and internet gateway are
// created on their own.
service VpcService {
  option (google.api.default_host) = "network.origincloudapis.eu";

  // Returns a VPC.
  rpc GetVpc(GetVpcRequest) returns (Vpc) {
    option (google.api.http) = {get: "/v1beta1/{name=projects/*/regions/*/vpcs/*}"};
    option (google.api.method_signature) = "name";
  }

  // Lists the VPCs in a region, oldest first.
  rpc ListVpcs(ListVpcsRequest) returns (ListVpcsResponse) {
    option (google.api.http) = {get: "/v1beta1/{parent=projects/*/regions/*}/vpcs"};
    option (google.api.method_signature) = "parent";
  }

  // Creates an empty VPC: no subnets, security groups, ACLs, route tables
  // or internet gateway. It relays DNS through the project's default DNS
  // policy in its region until a DNS policy association names another. The
  // operation is done once the VPC is recorded.
  rpc CreateVpc(CreateVpcRequest) returns (google.longrunning.Operation) {
    option (google.api.http) = {
      post: "/v1beta1/{parent=projects/*/regions/*}/vpcs"
      body: "vpc"
    };
    option (google.api.method_signature) = "parent,vpc";
    option (google.longrunning.operation_info) = {
      response_type: "Vpc"
      metadata_type: "origincloud.longrunning.v1beta1.OperationMetadata"
    };
  }

  // Changes a VPC's tags. The operation is done once the change is
  // recorded.
  rpc UpdateVpc(UpdateVpcRequest) returns (google.longrunning.Operation) {
    option (google.api.http) = {
      patch: "/v1beta1/{vpc.name=projects/*/regions/*/vpcs/*}"
      body: "vpc"
    };
    option (google.api.method_signature) = "vpc,update_mask";
    option (google.longrunning.operation_info) = {
      response_type: "Vpc"
      metadata_type: "origincloud.longrunning.v1beta1.OperationMetadata"
    };
  }

  // Deletes a VPC with its DNS policy association. Refused with
  // `FAILED_PRECONDITION` while the VPC has subnets, security groups,
  // ACLs, route tables or an internet gateway, except those the platform
  // created with it, which are deleted with it. The operation is done once
  // the change is recorded; the network applies it within seconds.
  rpc DeleteVpc(DeleteVpcRequest) returns (google.longrunning.Operation) {
    option (google.api.http) = {delete: "/v1beta1/{name=projects/*/regions/*/vpcs/*}"};
    option (google.api.method_signature) = "name";
    option (google.longrunning.operation_info) = {
      response_type: "google.protobuf.Empty"
      metadata_type: "origincloud.longrunning.v1beta1.OperationMetadata"
    };
  }
}

// A private network in one region.
message Vpc {
  option (google.api.resource) = {
    type: "network.origincloudapis.eu/Vpc"
    pattern: "projects/{project}/regions/{region}/vpcs/{vpc}"
    plural: "vpcs"
    singular: "vpc"
  };

  // The VPC's resource name.
  string name = 1 [(google.api.field_behavior) = IDENTIFIER];

  // The VPC's URN, the identifier access policies and the audit log use.
  string urn = 2 [(google.api.field_behavior) = OUTPUT_ONLY];

  // The private IPv4 range (RFC 1918), from `/16` to `/28`. A free `/16`
  // of the `172.16` private block when left empty. Subnets are carved from
  // it in equal sizes.
  string ipv4_cidr_block = 3 [
    (google.api.field_behavior) = IMMUTABLE,
    (google.api.field_behavior) = OPTIONAL
  ];

  // The IPv6 range the platform assigned, a `/56`. Each subnet gets a
  // `/72` of it.
  string ipv6_cidr_block = 4 [(google.api.field_behavior) = OUTPUT_ONLY];

  // The prefix length of every subnet's IPv4 range.
  int32 subnet_ipv4_prefix_length = 5 [(google.api.field_behavior) = OUTPUT_ONLY];

  // How many more subnets the VPC's address space holds.
  int32 available_subnet_count = 6 [(google.api.field_behavior) = OUTPUT_ONLY];

  // The DNS policy the VPC's resolver relays through, as the VPC's DNS
  // policy association (a `DnsPolicyAssociation`) sets it. Empty while it
  // has none: the VPC then relays through the project's default DNS policy
  // in its region.
  string dns_policy = 7 [
    (google.api.field_behavior) = OUTPUT_ONLY,
    (google.api.resource_reference).type = "network.origincloudapis.eu/DnsPolicy"
  ];

  // The VPC's internet gateway; empty while it has none.
  string internet_gateway = 8 [
    (google.api.field_behavior) = OUTPUT_ONLY,
    (google.api.resource_reference).type = "network.origincloudapis.eu/InternetGateway"
  ];

  // Whether this is the project's default VPC. Unlike a VPC you create, the
  // platform creates it with defaults: an internet gateway, and a security
  // group, an ACL and a main route table marked as created with the VPC
  // (`vpc_default` on the group and the ACL, `main` on the route table).
  bool project_default = 9 [(google.api.field_behavior) = OUTPUT_ONLY];

  // When the VPC was created.
  google.protobuf.Timestamp create_time = 10 [(google.api.field_behavior) = OUTPUT_ONLY];

  // The principal that created the VPC, such as `user:<id>` or
  // `service_account:<id>`; empty for one the platform created.
  string creator = 11 [(google.api.field_behavior) = OUTPUT_ONLY];

  // Labels of your own, at most 50. The `origin:name` tag is the name the
  // console shows.
  map<string, string> tags = 12 [(google.api.field_behavior) = OPTIONAL];
}

// The request for GetVpc.
message GetVpcRequest {
  // The VPC to return.
  string name = 1 [
    (google.api.field_behavior) = REQUIRED,
    (google.api.resource_reference).type = "network.origincloudapis.eu/Vpc"
  ];
}

// The request for ListVpcs.
message ListVpcsRequest {
  // The region whose VPCs to list, `projects/{project}/regions/{region}`.
  string parent = 1 [
    (google.api.field_behavior) = REQUIRED,
    (google.api.resource_reference).child_type = "network.origincloudapis.eu/Vpc"
  ];

  // The most VPCs to return; the server clamps it, and 0 means its
  // default.
  int32 page_size = 2 [(google.api.field_behavior) = OPTIONAL];

  // A previous response's `next_page_token`, for the page after it.
  string page_token = 3 [(google.api.field_behavior) = OPTIONAL];
}

// The response for ListVpcs.
message ListVpcsResponse {
  // The VPCs on this page.
  repeated Vpc vpcs = 1;

  // The token for the next page; empty on the last one.
  string next_page_token = 2;
}

// The request for CreateVpc.
message CreateVpcRequest {
  // The region to create the VPC in, `projects/{project}/regions/{region}`.
  string parent = 1 [
    (google.api.field_behavior) = REQUIRED,
    (google.api.resource_reference).child_type = "network.origincloudapis.eu/Vpc"
  ];

  // The VPC to create: optionally its IPv4 range and tags.
  Vpc vpc = 2 [(google.api.field_behavior) = REQUIRED];

  // A UUID; a repeat with the same id returns the first request's
  // operation instead of creating a second VPC.
  string request_id = 3 [
    (google.api.field_info).format = UUID4,
    (google.api.field_behavior) = OPTIONAL
  ];
}

// The request for UpdateVpc.
message UpdateVpcRequest {
  // The VPC, by its name, with the fields to change.
  Vpc vpc = 1 [(google.api.field_behavior) = REQUIRED];

  // The fields to change: `tags`, or `*`.
  google.protobuf.FieldMask update_mask = 2 [(google.api.field_behavior) = REQUIRED];

  // A UUID; a repeat with the same id returns the first request's
  // operation instead of changing the VPC again.
  string request_id = 3 [
    (google.api.field_info).format = UUID4,
    (google.api.field_behavior) = OPTIONAL
  ];
}

// The request for DeleteVpc.
message DeleteVpcRequest {
  // The VPC to delete.
  string name = 1 [
    (google.api.field_behavior) = REQUIRED,
    (google.api.resource_reference).type = "network.origincloudapis.eu/Vpc"
  ];

  // A UUID; a repeat with the same id returns the first request's
  // operation.
  string request_id = 2 [
    (google.api.field_info).format = UUID4,
    (google.api.field_behavior) = OPTIONAL
  ];
}
