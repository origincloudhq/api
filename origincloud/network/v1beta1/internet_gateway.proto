syntax = "proto3";

package origincloud.network.v1beta1;

import "google/api/annotations.proto";
import "google/api/client.proto";
import "google/api/field_behavior.proto";
import "google/api/field_info.proto";
import "google/api/resource.proto";
import "google/longrunning/operations.proto";
import "google/protobuf/field_mask.proto";
import "google/protobuf/timestamp.proto";
import "origincloud/longrunning/v1beta1/operations.proto";

// Internet gateways: a VPC's way to and from the internet, for its
// instances' floating IPs and IPv6 addresses and for its NAT gateways. A VPC
// has at most one, and a subnet reaches it through a route that targets it.
// Internet access is decided per VPC and address family: while any route
// table the VPC's subnets use has a family's default route to the gateway,
// traffic of that family leaves the VPC and reaches its floating IPs and
// IPv6 addresses.
service InternetGatewayService {
  option (google.api.default_host) = "network.origincloudapis.eu";

  // Returns an internet gateway.
  rpc GetInternetGateway(GetInternetGatewayRequest) returns (InternetGateway) {
    option (google.api.http) = {get: "/v1beta1/{name=projects/*/regions/*/internetGateways/*}"};
    option (google.api.method_signature) = "name";
  }

  // Lists the internet gateways in a region, oldest first.
  rpc ListInternetGateways(ListInternetGatewaysRequest) returns (ListInternetGatewaysResponse) {
    option (google.api.http) = {get: "/v1beta1/{parent=projects/*/regions/*}/internetGateways"};
    option (google.api.method_signature) = "parent";
  }

  // Creates a VPC's internet gateway. Refused with `FAILED_PRECONDITION`
  // when the VPC has one. The operation is done once the change is recorded;
  // the network applies it within seconds.
  rpc CreateInternetGateway(CreateInternetGatewayRequest) returns (google.longrunning.Operation) {
    option (google.api.http) = {
      post: "/v1beta1/{parent=projects/*/regions/*}/internetGateways"
      body: "internet_gateway"
    };
    option (google.api.method_signature) = "parent,internet_gateway";
    option (google.longrunning.operation_info) = {
      response_type: "InternetGateway"
      metadata_type: "origincloud.longrunning.v1beta1.OperationMetadata"
    };
  }

  // Changes an internet gateway's tags. The operation is done once the
  // change is recorded.
  rpc UpdateInternetGateway(UpdateInternetGatewayRequest) returns (google.longrunning.Operation) {
    option (google.api.http) = {
      patch: "/v1beta1/{internet_gateway.name=projects/*/regions/*/internetGateways/*}"
      body: "internet_gateway"
    };
    option (google.api.method_signature) = "internet_gateway,update_mask";
    option (google.longrunning.operation_info) = {
      response_type: "InternetGateway"
      metadata_type: "origincloud.longrunning.v1beta1.OperationMetadata"
    };
  }

  // Deletes an internet gateway, which cuts the VPC off from the internet.
  // Refused while a route targets it. The operation is done once the
  // change is recorded; the network applies it within seconds.
  rpc DeleteInternetGateway(DeleteInternetGatewayRequest) returns (google.longrunning.Operation) {
    option (google.api.http) = {delete: "/v1beta1/{name=projects/*/regions/*/internetGateways/*}"};
    option (google.api.method_signature) = "name";
    option (google.longrunning.operation_info) = {
      response_type: "google.protobuf.Empty"
      metadata_type: "origincloud.longrunning.v1beta1.OperationMetadata"
    };
  }
}

// A VPC's way to and from the internet.
message InternetGateway {
  option (google.api.resource) = {
    type: "network.origincloudapis.eu/InternetGateway"
    pattern: "projects/{project}/regions/{region}/internetGateways/{internet_gateway}"
    plural: "internetGateways"
    singular: "internetGateway"
  };

  // The gateway's resource name.
  string name = 1 [(google.api.field_behavior) = IDENTIFIER];

  // The gateway's URN, the identifier access policies and the audit log
  // use.
  string urn = 2 [(google.api.field_behavior) = OUTPUT_ONLY];

  // The VPC the gateway connects, in the same project and region.
  string vpc = 3 [
    (google.api.field_behavior) = REQUIRED,
    (google.api.field_behavior) = IMMUTABLE,
    (google.api.resource_reference).type = "network.origincloudapis.eu/Vpc"
  ];

  // When the internet gateway was created.
  google.protobuf.Timestamp create_time = 4 [(google.api.field_behavior) = OUTPUT_ONLY];

  // The principal that created the internet gateway, such as `user:<id>`
  // or `service_account:<id>`; empty for one the platform created.
  string creator = 5 [(google.api.field_behavior) = OUTPUT_ONLY];

  // Labels of your own, at most 50. The `origin:name` tag is the name the
  // console shows.
  map<string, string> tags = 6 [(google.api.field_behavior) = OPTIONAL];
}

// The request for GetInternetGateway.
message GetInternetGatewayRequest {
  // The internet gateway to return.
  string name = 1 [
    (google.api.field_behavior) = REQUIRED,
    (google.api.resource_reference).type = "network.origincloudapis.eu/InternetGateway"
  ];
}

// The request for ListInternetGateways.
message ListInternetGatewaysRequest {
  // The region whose internet gateways to list,
  // `projects/{project}/regions/{region}`.
  string parent = 1 [
    (google.api.field_behavior) = REQUIRED,
    (google.api.resource_reference).child_type = "network.origincloudapis.eu/InternetGateway"
  ];

  // The most internet gateways to return; the server clamps it, and 0
  // means its default.
  int32 page_size = 2 [(google.api.field_behavior) = OPTIONAL];

  // A previous response's `next_page_token`, for the page after it.
  string page_token = 3 [(google.api.field_behavior) = OPTIONAL];

  // Only the gateway of this VPC, when set.
  //
  // (-- api-linter: core::0132::request-unknown-fields=disabled
  //     aip.dev/not-precedent: a list is narrowed by typed fields, not a filter string. --)
  string vpc = 4 [
    (google.api.field_behavior) = OPTIONAL,
    (google.api.resource_reference).type = "network.origincloudapis.eu/Vpc"
  ];
}

// The response for ListInternetGateways.
message ListInternetGatewaysResponse {
  // The internet gateways on this page.
  repeated InternetGateway internet_gateways = 1;

  // The token for the next page; empty on the last one.
  string next_page_token = 2;
}

// The request for CreateInternetGateway.
message CreateInternetGatewayRequest {
  // The region to create the internet gateway in,
  // `projects/{project}/regions/{region}`.
  string parent = 1 [
    (google.api.field_behavior) = REQUIRED,
    (google.api.resource_reference).child_type = "network.origincloudapis.eu/InternetGateway"
  ];

  // The gateway to create: its VPC, and optionally its tags.
  InternetGateway internet_gateway = 2 [(google.api.field_behavior) = REQUIRED];

  // A UUID; a repeat with the same id returns the first request's
  // operation instead of creating a second internet gateway.
  string request_id = 3 [
    (google.api.field_info).format = UUID4,
    (google.api.field_behavior) = OPTIONAL
  ];
}

// The request for UpdateInternetGateway.
message UpdateInternetGatewayRequest {
  // The internet gateway, by its name, with the fields to change.
  InternetGateway internet_gateway = 1 [(google.api.field_behavior) = REQUIRED];

  // The fields to change: `tags`, or `*`.
  google.protobuf.FieldMask update_mask = 2 [(google.api.field_behavior) = REQUIRED];

  // A UUID; a repeat with the same id returns the first request's
  // operation instead of changing the internet gateway again.
  string request_id = 3 [
    (google.api.field_info).format = UUID4,
    (google.api.field_behavior) = OPTIONAL
  ];
}

// The request for DeleteInternetGateway.
message DeleteInternetGatewayRequest {
  // The internet gateway to delete.
  string name = 1 [
    (google.api.field_behavior) = REQUIRED,
    (google.api.resource_reference).type = "network.origincloudapis.eu/InternetGateway"
  ];

  // A UUID; a repeat with the same id returns the first request's
  // operation.
  string request_id = 2 [
    (google.api.field_info).format = UUID4,
    (google.api.field_behavior) = OPTIONAL
  ];
}
