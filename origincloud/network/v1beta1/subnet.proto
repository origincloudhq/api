syntax = "proto3";

package origincloud.network.v1beta1;

import "google/api/annotations.proto";
import "google/api/client.proto";
import "google/api/field_behavior.proto";
import "google/api/field_info.proto";
import "google/api/resource.proto";
import "google/longrunning/operations.proto";
import "google/protobuf/field_mask.proto";
import "google/protobuf/timestamp.proto";
import "origincloud/longrunning/v1beta1/operations.proto";

// Subnets: the part of a VPC in one zone. Network interfaces get their
// private addresses from a subnet. Its route table association decides
// where its traffic goes, and its ACL association what crosses its edge.
service SubnetService {
  option (google.api.default_host) = "network.origincloudapis.eu";

  // Returns a subnet.
  rpc GetSubnet(GetSubnetRequest) returns (Subnet) {
    option (google.api.http) = {get: "/v1beta1/{name=projects/*/zones/*/subnets/*}"};
    option (google.api.method_signature) = "name";
  }

  // Lists the subnets in a zone, oldest first. For every zone's subnets,
  // list the zones whose `services` name `network` with the location
  // service (`location.origincloudapis.eu`), then each zone's subnets.
  rpc ListSubnets(ListSubnetsRequest) returns (ListSubnetsResponse) {
    option (google.api.http) = {get: "/v1beta1/{parent=projects/*/zones/*}/subnets"};
    option (google.api.method_signature) = "parent";
  }

  // Creates a subnet in a VPC, with the next free IPv4 and IPv6 ranges of
  // the VPC's address space, and no route table or ACL association. The
  // operation is done once the change is recorded; the network applies it
  // within seconds.
  rpc CreateSubnet(CreateSubnetRequest) returns (google.longrunning.Operation) {
    option (google.api.http) = {
      post: "/v1beta1/{parent=projects/*/zones/*}/subnets"
      body: "subnet"
    };
    option (google.api.method_signature) = "parent,subnet";
    option (google.longrunning.operation_info) = {
      response_type: "Subnet"
      metadata_type: "origincloud.longrunning.v1beta1.OperationMetadata"
    };
  }

  // Changes a subnet's public address assignment or tags.
  // `auto_assign_public_ip` applies to instances launched afterwards. The
  // operation is done once the change is recorded.
  rpc UpdateSubnet(UpdateSubnetRequest) returns (google.longrunning.Operation) {
    option (google.api.http) = {
      patch: "/v1beta1/{subnet.name=projects/*/zones/*/subnets/*}"
      body: "subnet"
    };
    option (google.api.method_signature) = "subnet,update_mask";
    option (google.longrunning.operation_info) = {
      response_type: "Subnet"
      metadata_type: "origincloud.longrunning.v1beta1.OperationMetadata"
    };
  }

  // Deletes a subnet with its route table and ACL associations and its
  // unattached network interfaces. Refused while an interface in it is
  // attached or a NAT gateway lives in it. The operation is done once the
  // change is recorded; the network applies it within seconds.
  rpc DeleteSubnet(DeleteSubnetRequest) returns (google.longrunning.Operation) {
    option (google.api.http) = {delete: "/v1beta1/{name=projects/*/zones/*/subnets/*}"};
    option (google.api.method_signature) = "name";
    option (google.longrunning.operation_info) = {
      response_type: "google.protobuf.Empty"
      metadata_type: "origincloud.longrunning.v1beta1.OperationMetadata"
    };
  }
}

// The part of a VPC in one zone, with its own address ranges.
message Subnet {
  option (google.api.resource) = {
    type: "network.origincloudapis.eu/Subnet"
    pattern: "projects/{project}/zones/{zone}/subnets/{subnet}"
    plural: "subnets"
    singular: "subnet"
  };

  // The subnet's resource name.
  string name = 1 [(google.api.field_behavior) = IDENTIFIER];

  // The subnet's URN, the identifier access policies and the audit log
  // use.
  string urn = 2 [(google.api.field_behavior) = OUTPUT_ONLY];

  // The VPC the subnet is part of, in the same project and in the zone's
  // region. For now a VPC lives in one zone of its region: a subnet in
  // another zone is refused with `FAILED_PRECONDITION`.
  string vpc = 3 [
    (google.api.field_behavior) = REQUIRED,
    (google.api.field_behavior) = IMMUTABLE,
    (google.api.resource_reference).type = "network.origincloudapis.eu/Vpc"
  ];

  // The route table that decides where the subnet's traffic goes, as the
  // subnet's route table association (a `RouteTableAssociation`) sets it.
  // Empty while it has none: the subnet then has no route out of its VPC
  // and counts as a subnet whose route table has no default route. Internet
  // access is decided per VPC and address family, from the route tables of
  // all its subnets (a `Route` with that family's default destination).
  string route_table = 4 [
    (google.api.field_behavior) = OUTPUT_ONLY,
    (google.api.resource_reference).type = "network.origincloudapis.eu/RouteTable"
  ];

  // The ACL that filters traffic in and out of the subnet, as the subnet's
  // ACL association (an `AclAssociation`) sets it. Empty while it has
  // none: nothing is filtered at the subnet's edge, and its interfaces'
  // security groups still apply.
  string acl = 5 [
    (google.api.field_behavior) = OUTPUT_ONLY,
    (google.api.resource_reference).type = "network.origincloudapis.eu/Acl"
  ];

  // Whether an instance launched into the subnet gets a floating IP of
  // its own, released when the instance is terminated.
  bool auto_assign_public_ip = 6 [(google.api.field_behavior) = OPTIONAL];

  // The subnet's IPv4 range.
  string ipv4_cidr_block = 7 [(google.api.field_behavior) = OUTPUT_ONLY];

  // The subnet's IPv6 range, a `/72`.
  string ipv6_cidr_block = 8 [(google.api.field_behavior) = OUTPUT_ONLY];

  // The IPv4 address of the subnet's router.
  string ipv4_gateway = 9 [
    (google.api.field_info).format = IPV4,
    (google.api.field_behavior) = OUTPUT_ONLY
  ];

  // The IPv6 address of the subnet's router.
  string ipv6_gateway = 10 [
    (google.api.field_info).format = IPV6,
    (google.api.field_behavior) = OUTPUT_ONLY
  ];

  // The DNS servers instances in the subnet use over IPv4.
  repeated string ipv4_dns_servers = 11 [(google.api.field_behavior) = OUTPUT_ONLY];

  // The DNS servers instances in the subnet use over IPv6.
  repeated string ipv6_dns_servers = 12 [(google.api.field_behavior) = OUTPUT_ONLY];

  // How many IPv4 addresses in the subnet are free for interfaces.
  int64 available_ipv4_address_count = 13 [(google.api.field_behavior) = OUTPUT_ONLY];

  // When the subnet was created.
  google.protobuf.Timestamp create_time = 14 [(google.api.field_behavior) = OUTPUT_ONLY];

  // The principal that created the subnet, such as `user:<id>` or
  // `service_account:<id>`; empty for one the platform created.
  string creator = 15 [(google.api.field_behavior) = OUTPUT_ONLY];

  // Labels of your own, at most 50. The `origin:name` tag is the name the
  // console shows.
  map<string, string> tags = 16 [(google.api.field_behavior) = OPTIONAL];
}

// The request for GetSubnet.
message GetSubnetRequest {
  // The subnet to return.
  string name = 1 [
    (google.api.field_behavior) = REQUIRED,
    (google.api.resource_reference).type = "network.origincloudapis.eu/Subnet"
  ];
}

// The request for ListSubnets.
message ListSubnetsRequest {
  // The zone whose subnets to list, `projects/{project}/zones/{zone}`.
  string parent = 1 [
    (google.api.field_behavior) = REQUIRED,
    (google.api.resource_reference).child_type = "network.origincloudapis.eu/Subnet"
  ];

  // The most subnets to return; the server clamps it, and 0 means its
  // default.
  int32 page_size = 2 [(google.api.field_behavior) = OPTIONAL];

  // A previous response's `next_page_token`, for the page after it.
  string page_token = 3 [(google.api.field_behavior) = OPTIONAL];

  // Only the subnets of this VPC, when set.
  //
  // (-- api-linter: core::0132::request-unknown-fields=disabled
  //     aip.dev/not-precedent: a list is narrowed by typed fields, not a filter string. --)
  string vpc = 4 [
    (google.api.field_behavior) = OPTIONAL,
    (google.api.resource_reference).type = "network.origincloudapis.eu/Vpc"
  ];
}

// The response for ListSubnets.
message ListSubnetsResponse {
  // The subnets on this page.
  repeated Subnet subnets = 1;

  // The token for the next page; empty on the last one.
  string next_page_token = 2;
}

// The request for CreateSubnet.
message CreateSubnetRequest {
  // The zone to create the subnet in, `projects/{project}/zones/{zone}`.
  string parent = 1 [
    (google.api.field_behavior) = REQUIRED,
    (google.api.resource_reference).child_type = "network.origincloudapis.eu/Subnet"
  ];

  // The subnet to create: its VPC, and optionally its public address
  // assignment and tags.
  Subnet subnet = 2 [(google.api.field_behavior) = REQUIRED];

  // A UUID; a repeat with the same id returns the first request's
  // operation instead of creating a second subnet.
  string request_id = 3 [
    (google.api.field_info).format = UUID4,
    (google.api.field_behavior) = OPTIONAL
  ];
}

// The request for UpdateSubnet.
message UpdateSubnetRequest {
  // The subnet, by its name, with the fields to change.
  Subnet subnet = 1 [(google.api.field_behavior) = REQUIRED];

  // The fields to change: `auto_assign_public_ip`, `tags`, or both. `*`
  // is both.
  google.protobuf.FieldMask update_mask = 2 [(google.api.field_behavior) = REQUIRED];

  // A UUID; a repeat with the same id returns the first request's
  // operation instead of changing the subnet again.
  string request_id = 3 [
    (google.api.field_info).format = UUID4,
    (google.api.field_behavior) = OPTIONAL
  ];
}

// The request for DeleteSubnet.
message DeleteSubnetRequest {
  // The subnet to delete.
  string name = 1 [
    (google.api.field_behavior) = REQUIRED,
    (google.api.resource_reference).type = "network.origincloudapis.eu/Subnet"
  ];

  // A UUID; a repeat with the same id returns the first request's
  // operation.
  string request_id = 2 [
    (google.api.field_info).format = UUID4,
    (google.api.field_behavior) = OPTIONAL
  ];
}
