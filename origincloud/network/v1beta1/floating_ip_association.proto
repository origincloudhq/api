syntax = "proto3";

package origincloud.network.v1beta1;

import "google/api/annotations.proto";
import "google/api/client.proto";
import "google/api/field_behavior.proto";
import "google/api/field_info.proto";
import "google/api/resource.proto";
import "google/longrunning/operations.proto";
import "origincloud/longrunning/v1beta1/operations.proto";

// Floating IP associations: which network interface a floating IP reaches. A
// floating IP has at most one (see the floating IP's `network_interface`).
// An association's id is the id of the network interface it names, so a
// client that knows the floating IP and the interface names the association
// without listing. To move an address to another interface, delete its
// association and create another.
service FloatingIpAssociationService {
  option (google.api.default_host) = "network.origincloudapis.eu";

  // Returns a floating IP association.
  rpc GetFloatingIpAssociation(GetFloatingIpAssociationRequest) returns (FloatingIpAssociation) {
    option (google.api.http) = {get: "/v1beta1/{name=projects/*/zones/*/floatingIps/*/associations/*}"};
    option (google.api.method_signature) = "name";
  }

  // Lists a floating IP's associations: none or one.
  rpc ListFloatingIpAssociations(ListFloatingIpAssociationsRequest) returns (ListFloatingIpAssociationsResponse) {
    option (google.api.http) = {get: "/v1beta1/{parent=projects/*/zones/*/floatingIps/*}/associations"};
    option (google.api.method_signature) = "parent";
  }

  // Associates a floating IP with a network interface. Refused with
  // `FAILED_PRECONDITION` when the floating IP has an association, and
  // while the address backs a NAT gateway. The operation is done once the
  // change is recorded; the network applies it within seconds.
  rpc CreateFloatingIpAssociation(CreateFloatingIpAssociationRequest) returns (google.longrunning.Operation) {
    option (google.api.http) = {
      post: "/v1beta1/{parent=projects/*/zones/*/floatingIps/*}/associations"
      body: "floating_ip_association"
    };
    option (google.api.method_signature) = "parent,floating_ip_association";
    option (google.longrunning.operation_info) = {
      response_type: "FloatingIpAssociation"
      metadata_type: "origincloud.longrunning.v1beta1.OperationMetadata"
    };
  }

  // Removes a floating IP's association: the address reaches nothing, and
  // stays allocated. Refused for an address the platform assigned at
  // launch (`auto_assigned`), which is released with its network interface.
  // The operation is done once the change is recorded; the network applies
  // it within seconds.
  rpc DeleteFloatingIpAssociation(DeleteFloatingIpAssociationRequest) returns (google.longrunning.Operation) {
    option (google.api.http) = {delete: "/v1beta1/{name=projects/*/zones/*/floatingIps/*/associations/*}"};
    option (google.api.method_signature) = "name";
    option (google.longrunning.operation_info) = {
      response_type: "google.protobuf.Empty"
      metadata_type: "origincloud.longrunning.v1beta1.OperationMetadata"
    };
  }
}

// The network interface a floating IP reaches.
message FloatingIpAssociation {
  option (google.api.resource) = {
    type: "network.origincloudapis.eu/FloatingIpAssociation"
    pattern: "projects/{project}/zones/{zone}/floatingIps/{floating_ip}/associations/{association}"
    plural: "floatingIpAssociations"
    singular: "floatingIpAssociation"
  };

  // The association's resource name. Its last segment is the network
  // interface's id.
  string name = 1 [(google.api.field_behavior) = IDENTIFIER];

  // The network interface the address reaches, in the floating IP's project
  // and zone.
  string network_interface = 2 [
    (google.api.field_behavior) = REQUIRED,
    (google.api.field_behavior) = IMMUTABLE,
    (google.api.resource_reference).type = "network.origincloudapis.eu/NetworkInterface"
  ];

  // The interface's private IPv4 address the public one translates to.
  string private_address = 3 [
    (google.api.field_info).format = IPV4,
    (google.api.field_behavior) = OUTPUT_ONLY
  ];
}

// The request for GetFloatingIpAssociation.
message GetFloatingIpAssociationRequest {
  // The association to return.
  string name = 1 [
    (google.api.field_behavior) = REQUIRED,
    (google.api.resource_reference).type = "network.origincloudapis.eu/FloatingIpAssociation"
  ];
}

// The request for ListFloatingIpAssociations.
message ListFloatingIpAssociationsRequest {
  // The floating IP whose association to list,
  // `projects/{project}/zones/{zone}/floatingIps/{floating_ip}`.
  string parent = 1 [
    (google.api.field_behavior) = REQUIRED,
    (google.api.resource_reference).child_type = "network.origincloudapis.eu/FloatingIpAssociation"
  ];

  // The most associations to return; the server clamps it, and 0 means
  // its default.
  int32 page_size = 2 [(google.api.field_behavior) = OPTIONAL];

  // A previous response's `next_page_token`, for the page after it.
  string page_token = 3 [(google.api.field_behavior) = OPTIONAL];
}

// The response for ListFloatingIpAssociations.
message ListFloatingIpAssociationsResponse {
  // The associations on this page.
  repeated FloatingIpAssociation floating_ip_associations = 1;

  // The token for the next page; empty on the last one.
  string next_page_token = 2;
}

// The request for CreateFloatingIpAssociation.
message CreateFloatingIpAssociationRequest {
  // The floating IP to associate,
  // `projects/{project}/zones/{zone}/floatingIps/{floating_ip}`.
  string parent = 1 [
    (google.api.field_behavior) = REQUIRED,
    (google.api.resource_reference).child_type = "network.origincloudapis.eu/FloatingIpAssociation"
  ];

  // The association to create: its network interface.
  FloatingIpAssociation floating_ip_association = 2 [(google.api.field_behavior) = REQUIRED];

  // A UUID; a repeat with the same id returns the first request's
  // operation.
  string request_id = 3 [
    (google.api.field_info).format = UUID4,
    (google.api.field_behavior) = OPTIONAL
  ];
}

// The request for DeleteFloatingIpAssociation.
message DeleteFloatingIpAssociationRequest {
  // The association to remove.
  string name = 1 [
    (google.api.field_behavior) = REQUIRED,
    (google.api.resource_reference).type = "network.origincloudapis.eu/FloatingIpAssociation"
  ];

  // A UUID; a repeat with the same id returns the first request's
  // operation.
  string request_id = 2 [
    (google.api.field_info).format = UUID4,
    (google.api.field_behavior) = OPTIONAL
  ];
}
