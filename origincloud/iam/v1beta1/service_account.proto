syntax = "proto3";

package origincloud.iam.v1beta1;

import "google/api/annotations.proto";
import "google/api/client.proto";
import "google/api/field_behavior.proto";
import "google/api/field_info.proto";
import "google/api/resource.proto";
import "google/protobuf/empty.proto";
import "google/protobuf/timestamp.proto";

// Service accounts: an organization's credentials for software, which
// authenticate with the OAuth 2.0 client credentials grant and never log
// in interactively. A new service account holds no role: grant it one with
// a role binding on its `member`.
service ServiceAccountService {
  option (google.api.default_host) = "iam.origincloudapis.eu";

  // Returns a service account, deleted or not. Needs
  // `iam.service_account.list` on the organization.
  rpc GetServiceAccount(GetServiceAccountRequest) returns (ServiceAccount) {
    option (google.api.http) = {get: "/v1beta1/{name=organizations/*/serviceAccounts/*}"};
    option (google.api.method_signature) = "name";
  }

  // Lists an organization's service accounts, oldest first. Deleted ones
  // are listed only when `show_deleted` is set. Needs
  // `iam.service_account.list` on the organization.
  rpc ListServiceAccounts(ListServiceAccountsRequest) returns (ListServiceAccountsResponse) {
    option (google.api.http) = {get: "/v1beta1/{parent=organizations/*}/serviceAccounts"};
    option (google.api.method_signature) = "parent";
  }

  // Creates a service account and its client secret. The response is the
  // only place the secret is ever shown: store it now. Needs
  // `iam.service_account.create` on the organization.
  rpc CreateServiceAccount(CreateServiceAccountRequest) returns (ServiceAccount) {
    option (google.api.http) = {
      post: "/v1beta1/{parent=organizations/*}/serviceAccounts"
      body: "service_account"
    };
    option (google.api.method_signature) = "parent,service_account";
  }

  // Deletes a service account for good: its credential is refused from
  // then on, an access token it already holds is refused on its next
  // request, and every role binding it holds, in any organization, is
  // removed. It stays readable as `DELETED`. Deleting a deleted service
  // account succeeds. Needs `iam.service_account.revoke` on the
  // organization.
  rpc DeleteServiceAccount(DeleteServiceAccountRequest) returns (google.protobuf.Empty) {
    option (google.api.http) = {delete: "/v1beta1/{name=organizations/*/serviceAccounts/*}"};
    option (google.api.method_signature) = "name";
  }
}

// A credential of an organization for software.
message ServiceAccount {
  option (google.api.resource) = {
    type: "iam.origincloudapis.eu/ServiceAccount"
    pattern: "organizations/{organization}/serviceAccounts/{service_account}"
    plural: "serviceAccounts"
    singular: "serviceAccount"
  };

  // Where the service account is in its lifecycle.
  enum State {
    // Not set.
    STATE_UNSPECIFIED = 0;
    // Its credential is accepted.
    ACTIVE = 1;
    // Deleted: its credential is refused, and it holds no role binding.
    DELETED = 2;
  }

  // The service account's resource name.
  string name = 1 [(google.api.field_behavior) = IDENTIFIER];

  // A name of your own, shown in the console; at most 100 characters.
  string display_name = 2 [
    (google.api.field_behavior) = REQUIRED,
    (google.api.field_behavior) = IMMUTABLE
  ];

  // The member a role binding names it by,
  // `serviceAccount:{service_account}`.
  string member = 3 [(google.api.field_behavior) = OUTPUT_ONLY];

  // The OAuth 2.0 client id it authenticates with.
  string client_id = 4 [(google.api.field_behavior) = OUTPUT_ONLY];

  // The OAuth 2.0 client secret it authenticates with. Set only in the
  // response that created the service account, and empty everywhere else:
  // it can't be read again.
  string client_secret = 5 [(google.api.field_behavior) = OUTPUT_ONLY];

  // Where the service account is in its lifecycle.
  State state = 6 [(google.api.field_behavior) = OUTPUT_ONLY];

  // Who created the service account, written as a role binding's member
  // is.
  string creator = 7 [(google.api.field_behavior) = OUTPUT_ONLY];

  // When the service account was created.
  google.protobuf.Timestamp create_time = 8 [(google.api.field_behavior) = OUTPUT_ONLY];

  // When the service account was deleted; unset while it is active.
  google.protobuf.Timestamp delete_time = 9 [(google.api.field_behavior) = OUTPUT_ONLY];
}

// The request for GetServiceAccount.
message GetServiceAccountRequest {
  // The service account to return.
  string name = 1 [
    (google.api.field_behavior) = REQUIRED,
    (google.api.resource_reference).type = "iam.origincloudapis.eu/ServiceAccount"
  ];
}

// The request for ListServiceAccounts.
message ListServiceAccountsRequest {
  // The organization whose service accounts to list,
  // `organizations/{organization}`.
  string parent = 1 [
    (google.api.field_behavior) = REQUIRED,
    (google.api.resource_reference).child_type = "iam.origincloudapis.eu/ServiceAccount"
  ];

  // The most service accounts to return; the server clamps it, and 0 means
  // its default.
  int32 page_size = 2 [(google.api.field_behavior) = OPTIONAL];

  // A previous response's `next_page_token`, for the page after it.
  string page_token = 3 [(google.api.field_behavior) = OPTIONAL];

  // Whether deleted service accounts are listed too.
  bool show_deleted = 4 [(google.api.field_behavior) = OPTIONAL];
}

// The response for ListServiceAccounts.
message ListServiceAccountsResponse {
  // The service accounts on this page.
  repeated ServiceAccount service_accounts = 1;

  // The token for the next page; empty on the last one.
  string next_page_token = 2;
}

// The request for CreateServiceAccount.
message CreateServiceAccountRequest {
  // The organization to create the service account in,
  // `organizations/{organization}`.
  string parent = 1 [
    (google.api.field_behavior) = REQUIRED,
    (google.api.resource_reference).child_type = "iam.origincloudapis.eu/ServiceAccount"
  ];

  // The service account to create: its `display_name`.
  ServiceAccount service_account = 2 [(google.api.field_behavior) = REQUIRED];

  // A UUID. A repeat of the request with the same `request_id` within a
  // day creates nothing and is refused with `CONFLICT`: the secret went to
  // the first request only. The error's `ErrorInfo` metadata names the
  // service account under `serviceAccount`; delete it and create a new one
  // to get a working secret. The same `request_id` with a different
  // request is refused with `CONFLICT` without that metadata.
  string request_id = 3 [
    (google.api.field_info).format = UUID4,
    (google.api.field_behavior) = OPTIONAL
  ];
}

// The request for DeleteServiceAccount.
message DeleteServiceAccountRequest {
  // The service account to delete.
  string name = 1 [
    (google.api.field_behavior) = REQUIRED,
    (google.api.resource_reference).type = "iam.origincloudapis.eu/ServiceAccount"
  ];
}
