syntax = "proto3";

// Users, service accounts, roles, role bindings, permissions and the audit log.
//
// A role is a predefined, named set of permissions; a role binding grants
// one to a user, a service account or a platform service agent,
// organization-wide or in one project.
// An organization's audit log records each change to who may do what in it.
package origincloud.iam.v1beta1;

import "google/api/annotations.proto";
import "google/api/client.proto";
import "google/api/field_behavior.proto";
import "google/api/field_info.proto";
import "google/api/resource.proto";
import "google/protobuf/empty.proto";
import "google/protobuf/timestamp.proto";

// Role bindings: each grants one role to one member, in a whole
// organization or in one of its projects. A member's access is the union
// of its bindings. Each binding is managed on its own, so creating or
// deleting one never touches another, whoever made it.
//
// A member is named by its full name, and only by it, one of:
// - `//iam.origincloudapis.eu/users/{user}`: a user, by the id of their
//   account, which must exist and be enabled.
// - `//iam.origincloudapis.eu/organizations/{organization}/serviceAccounts/{service_account}`:
//   one of the organization's own service accounts.
// - `//iam.origincloudapis.eu/serviceAgents/{service_agent}`: a platform
//   service agent, such as `//iam.origincloudapis.eu/serviceAgents/compute`.
//   A service agent is the identity one of the platform's services acts as
//   in an organization. Any organization can bind one, but only to a role
//   its service needs; nobody outside the platform can act as one or get a
//   credential for it. Every organization is created with compute's service
//   agent bound to `roles/kms.grant-delegate`; delete that binding and
//   compute makes no new grants on the organization's keys.
//
// A user known only by an email address is found with
// `UserService.LookupUser`, which answers their name.
//
// A binding is `ACTIVE` or `PENDING`. A pending binding is an invitation:
// a role granted to an email address that has no account yet. It grants
// nothing and counts toward no permission check. When someone signs up
// with that address and verifies it, the binding becomes active under the
// same name, and its member becomes the new user. It is activated only
// while whoever created it still holds every permission of the role in
// the organization; otherwise it is dropped. A pending binding is always
// on the whole organization.
service RoleBindingService {
  option (google.api.default_host) = "iam.origincloudapis.eu";

  // Returns a role binding. Needs `iam.member.list` on the organization.
  rpc GetRoleBinding(GetRoleBindingRequest) returns (RoleBinding) {
    option (google.api.http) = {get: "/v1beta1/{name=organizations/*/roleBindings/*}"};
    option (google.api.method_signature) = "name";
  }

  // Lists an organization's role bindings, active and pending, oldest
  // first, optionally only a member's or a project's. Needs
  // `iam.member.list` on the organization. With the parent
  // `organizations/-` it lists the caller's own active bindings in every
  // organization and needs no permission; `member` must be empty there.
  rpc ListRoleBindings(ListRoleBindingsRequest) returns (ListRoleBindingsResponse) {
    option (google.api.http) = {get: "/v1beta1/{parent=organizations/*}/roleBindings"};
    option (google.api.method_signature) = "parent";
  }

  // Grants a role to a member. Needs `iam.role.assign` on the
  // organization, for a project binding as well, and every permission of
  // the role at the binding's scope: a permission held on the organization
  // counts for any scope, one held on a project only for that project.
  // Refused with `NOT_FOUND` when `member` names a user without an enabled
  // account or a service account of another organization.
  // Refused with `CONFLICT` when the member already holds the role at that
  // scope, and with `BAD_REQUEST` when the member is a deleted service
  // account, names no service agent the platform has, or is a service
  // agent and the role isn't one its service needs.
  rpc CreateRoleBinding(CreateRoleBindingRequest) returns (RoleBinding) {
    option (google.api.http) = {
      post: "/v1beta1/{parent=organizations/*}/roleBindings"
      body: "role_binding"
    };
    option (google.api.method_signature) = "parent,role_binding";
  }

  // Removes a role binding. Needs `iam.role.revoke` on the organization
  // and every permission of the role at the binding's scope, as
  // CreateRoleBinding does. Refused with `CONFLICT`, removing nothing,
  // when it is the organization's last organization-wide binding of
  // `roles/owner`: bind another owner first. Deleting a pending binding
  // withdraws the invitation: signing up with its address afterwards
  // grants nothing.
  rpc DeleteRoleBinding(DeleteRoleBindingRequest) returns (google.protobuf.Empty) {
    option (google.api.http) = {delete: "/v1beta1/{name=organizations/*/roleBindings/*}"};
    option (google.api.method_signature) = "name";
  }
}

// One role granted to one member, organization-wide or in one project. A
// binding can't be changed: delete it and create another.
message RoleBinding {
  option (google.api.resource) = {
    type: "iam.origincloudapis.eu/RoleBinding"
    pattern: "organizations/{organization}/roleBindings/{role_binding}"
    plural: "roleBindings"
    singular: "roleBinding"
  };

  // Whether the binding grants its role yet.
  enum State {
    // Not set.
    STATE_UNSPECIFIED = 0;
    // The member holds the role.
    ACTIVE = 1;
    // An invitation to an email address with no account yet: it grants
    // nothing until someone signs up with the address and verifies it.
    PENDING = 2;
  }

  // The binding's resource name. A pending binding keeps its name when it
  // becomes active.
  string name = 1 [(google.api.field_behavior) = IDENTIFIER];

  // The full name of who holds the role: a user,
  // `//iam.origincloudapis.eu/users/{user}`, one of the organization's
  // service accounts,
  // `//iam.origincloudapis.eu/organizations/{organization}/serviceAccounts/{service_account}`,
  // or a platform service agent,
  // `//iam.origincloudapis.eu/serviceAgents/{service_agent}`. A pending
  // binding's member is `user:{email}`, the address it was granted to,
  // until it becomes active.
  string member = 3 [
    (google.api.field_behavior) = REQUIRED,
    (google.api.field_behavior) = IMMUTABLE,
    (google.api.resource_reference).type = "*"
  ];

  // The full name of the role granted,
  // `//iam.origincloudapis.eu/roles/{role}`.
  string role = 4 [
    (google.api.field_behavior) = REQUIRED,
    (google.api.field_behavior) = IMMUTABLE,
    (google.api.resource_reference).type = "iam.origincloudapis.eu/Role"
  ];

  // The full name of the project the binding is limited to, one of the
  // organization's: `//resourcemanager.origincloudapis.eu/projects/{project}`.
  // Empty for a binding on the whole organization, which covers every
  // project in it.
  string project = 5 [
    (google.api.field_behavior) = OPTIONAL,
    (google.api.field_behavior) = IMMUTABLE,
    (google.api.resource_reference).type = "resourcemanager.origincloudapis.eu/Project"
  ];

  // The full name of who created the binding: `//iam.origincloudapis.eu/users/{user}`,
  // `//iam.origincloudapis.eu/organizations/{organization}/serviceAccounts/{service_account}`,
  // `//iam.origincloudapis.eu/serviceAgents/{service_agent}` for a platform
  // service agent, or `//iam.origincloudapis.eu/services/{service}` for a
  // change the platform made itself.
  string creator = 6 [
    (google.api.field_behavior) = OUTPUT_ONLY,
    (google.api.resource_reference).type = "*"
  ];

  // When the binding was created.
  google.protobuf.Timestamp create_time = 7 [(google.api.field_behavior) = OUTPUT_ONLY];

  // Whether the binding grants its role yet.
  State state = 8 [(google.api.field_behavior) = OUTPUT_ONLY];
}

// The request for GetRoleBinding.
message GetRoleBindingRequest {
  // The binding to return.
  string name = 1 [
    (google.api.field_behavior) = REQUIRED,
    (google.api.resource_reference).type = "iam.origincloudapis.eu/RoleBinding"
  ];
}

// The request for ListRoleBindings.
message ListRoleBindingsRequest {
  // The organization whose bindings to list, `organizations/{organization}`,
  // or `organizations/-` for the caller's own bindings in every
  // organization.
  string parent = 1 [
    (google.api.field_behavior) = REQUIRED,
    (google.api.resource_reference).child_type = "iam.origincloudapis.eu/RoleBinding"
  ];

  // Only the bindings of this member, by its full name, as a binding's
  // `member` names it, or a pending binding's `user:{email}`, matched
  // without regard to case. Every member's when empty.
  //
  // (-- api-linter: core::0132::request-unknown-fields=disabled
  //     aip.dev/not-precedent: a typed filter, in place of a filter string. --)
  string member = 2 [
    (google.api.field_behavior) = OPTIONAL,
    (google.api.resource_reference).type = "*"
  ];

  // Only the bindings limited to this project, by its full name,
  // `//resourcemanager.origincloudapis.eu/projects/{project}`. Every
  // binding, organization-wide or not, when empty.
  //
  // (-- api-linter: core::0132::request-unknown-fields=disabled
  //     aip.dev/not-precedent: a typed filter, in place of a filter string. --)
  string project = 3 [
    (google.api.field_behavior) = OPTIONAL,
    (google.api.resource_reference).type = "resourcemanager.origincloudapis.eu/Project"
  ];

  // The most bindings to return; the server clamps it, and 0 means its
  // default.
  int32 page_size = 4 [(google.api.field_behavior) = OPTIONAL];

  // A previous response's `next_page_token`, for the page after it.
  string page_token = 5 [(google.api.field_behavior) = OPTIONAL];
}

// The response for ListRoleBindings.
message ListRoleBindingsResponse {
  // The bindings on this page.
  repeated RoleBinding role_bindings = 1;

  // The token for the next page; empty on the last one.
  string next_page_token = 2;
}

// The request for CreateRoleBinding.
message CreateRoleBindingRequest {
  // The organization to create the binding in,
  // `organizations/{organization}`.
  string parent = 1 [
    (google.api.field_behavior) = REQUIRED,
    (google.api.resource_reference).child_type = "iam.origincloudapis.eu/RoleBinding"
  ];

  // The binding to create: its member and role, and optionally its
  // project.
  RoleBinding role_binding = 2 [(google.api.field_behavior) = REQUIRED];

  // A UUID. A repeat of the request with the same `request_id` within a
  // day returns the binding the first request created, as it is now,
  // instead of being refused as a conflict.
  string request_id = 3 [
    (google.api.field_info).format = UUID4,
    (google.api.field_behavior) = OPTIONAL
  ];
}

// The request for DeleteRoleBinding.
message DeleteRoleBindingRequest {
  // The binding to delete.
  string name = 1 [
    (google.api.field_behavior) = REQUIRED,
    (google.api.resource_reference).type = "iam.origincloudapis.eu/RoleBinding"
  ];

  // A UUID. A repeat of the request with the same `request_id` within a
  // day succeeds as the first did, instead of answering `NOT_FOUND`.
  string request_id = 2 [
    (google.api.field_info).format = UUID4,
    (google.api.field_behavior) = OPTIONAL
  ];
}
