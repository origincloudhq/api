syntax = "proto3";

package origincloud.iam.v1beta1;

import "google/api/annotations.proto";
import "google/api/client.proto";
import "google/api/field_behavior.proto";
import "google/api/field_info.proto";
import "google/api/resource.proto";
import "google/protobuf/empty.proto";
import "google/protobuf/timestamp.proto";

// Federated credentials: a `WORKLOAD` service account's trust in the OIDC
// tokens of an identity provider outside Origin Cloud, such as the token
// GitHub Actions gives every job. Software holding a matching token
// exchanges it for the service account's access token, so no secret is
// stored where it runs. A trust policy names the token's issuer and
// audience exactly, and the claims it must carry. To change one, create
// the new one and delete the old.
service FederatedCredentialService {
  option (google.api.default_host) = "iam.origincloudapis.eu";

  // Returns a federated credential, deleted or not. Needs
  // `iam.service_account.list` on the organization.
  rpc GetFederatedCredential(GetFederatedCredentialRequest) returns (FederatedCredential) {
    option (google.api.http) = {get: "/v1beta1/{name=organizations/*/serviceAccounts/*/federatedCredentials/*}"};
    option (google.api.method_signature) = "name";
  }

  // Lists a service account's federated credentials, oldest first. Deleted
  // ones are listed only when `show_deleted` is set. Needs
  // `iam.service_account.list` on the organization.
  rpc ListFederatedCredentials(ListFederatedCredentialsRequest) returns (ListFederatedCredentialsResponse) {
    option (google.api.http) = {get: "/v1beta1/{parent=organizations/*/serviceAccounts/*}/federatedCredentials"};
    option (google.api.method_signature) = "parent";
  }

  // Creates a federated credential on an active `WORKLOAD` service
  // account. Anyone whose token matches it acts as the service account, so
  // creating one needs `iam.service_account.create` and
  // `iam.service_account.act_as` on the organization: the right to act as
  // the account yourself. Refused with `INVALID_ARGUMENT` when a condition
  // contains `*`, or when no condition names an identity that never
  // changes: `repository_id` or `repository_owner_id` for GitHub Actions'
  // issuer, `sub` for any other.
  rpc CreateFederatedCredential(CreateFederatedCredentialRequest) returns (FederatedCredential) {
    option (google.api.http) = {
      post: "/v1beta1/{parent=organizations/*/serviceAccounts/*}/federatedCredentials"
      body: "federated_credential"
    };
    option (google.api.method_signature) = "parent,federated_credential";
  }

  // Deletes a federated credential: no token is exchanged for it from then
  // on, and an access token already exchanged for it is refused on its
  // next request. It stays readable as `DELETED`. Deleting a deleted one
  // succeeds. Needs `iam.service_account.revoke` on the organization.
  rpc DeleteFederatedCredential(DeleteFederatedCredentialRequest) returns (google.protobuf.Empty) {
    option (google.api.http) = {delete: "/v1beta1/{name=organizations/*/serviceAccounts/*/federatedCredentials/*}"};
    option (google.api.method_signature) = "name";
  }
}

// A `WORKLOAD` service account's trust in an identity provider's OIDC
// tokens that carry the given claims.
message FederatedCredential {
  option (google.api.resource) = {
    type: "iam.origincloudapis.eu/FederatedCredential"
    pattern: "organizations/{organization}/serviceAccounts/{service_account}/federatedCredentials/{federated_credential}"
    plural: "federatedCredentials"
    singular: "federatedCredential"
  };

  // Where the federated credential is in its lifecycle.
  enum State {
    // Not set.
    STATE_UNSPECIFIED = 0;
    // Tokens that match it are exchanged.
    ACTIVE = 1;
    // Deleted: no token is exchanged for it.
    DELETED = 2;
  }

  // The federated credential's resource name.
  string name = 1 [(google.api.field_behavior) = IDENTIFIER];

  // A name of your own, shown in the console; at most 100 characters.
  string display_name = 2 [
    (google.api.field_behavior) = REQUIRED,
    (google.api.field_behavior) = IMMUTABLE
  ];

  // The identity provider whose tokens are trusted: a token's `iss`, matched
  // exactly, an `https` URL that serves
  // `/.well-known/openid-configuration`, such as
  // `https://token.actions.githubusercontent.com`.
  string issuer = 3 [
    (google.api.field_behavior) = REQUIRED,
    (google.api.field_behavior) = IMMUTABLE
  ];

  // The audience a token must be issued for, its `aud`, matched exactly;
  // `https://sts.origincloudapis.eu` when the create leaves it empty.
  string audience = 4 [
    (google.api.field_behavior) = OPTIONAL,
    (google.api.field_behavior) = IMMUTABLE
  ];

  // The claims a token must carry, each with exactly this value, such as
  // `repository_id` and `environment` for GitHub Actions. At least one, on
  // an identity that never changes.
  map<string, string> conditions = 5 [
    (google.api.field_behavior) = REQUIRED,
    (google.api.field_behavior) = IMMUTABLE
  ];

  // Where the federated credential is in its lifecycle.
  State state = 6 [(google.api.field_behavior) = OUTPUT_ONLY];

  // Who created the federated credential, written as a role binding's
  // member is.
  string creator = 7 [(google.api.field_behavior) = OUTPUT_ONLY];

  // When the federated credential was created.
  google.protobuf.Timestamp create_time = 8 [(google.api.field_behavior) = OUTPUT_ONLY];

  // When the federated credential was deleted; unset while it is active.
  google.protobuf.Timestamp delete_time = 9 [(google.api.field_behavior) = OUTPUT_ONLY];
}

// The request for GetFederatedCredential.
message GetFederatedCredentialRequest {
  // The federated credential to return.
  string name = 1 [
    (google.api.field_behavior) = REQUIRED,
    (google.api.resource_reference).type = "iam.origincloudapis.eu/FederatedCredential"
  ];
}

// The request for ListFederatedCredentials.
message ListFederatedCredentialsRequest {
  // The service account whose federated credentials to list,
  // `organizations/{organization}/serviceAccounts/{service_account}`.
  string parent = 1 [
    (google.api.field_behavior) = REQUIRED,
    (google.api.resource_reference).child_type = "iam.origincloudapis.eu/FederatedCredential"
  ];

  // The most federated credentials to return; the server clamps it, and 0
  // means its default.
  int32 page_size = 2 [(google.api.field_behavior) = OPTIONAL];

  // A previous response's `next_page_token`, for the page after it.
  string page_token = 3 [(google.api.field_behavior) = OPTIONAL];

  // Whether deleted federated credentials are listed too.
  bool show_deleted = 4 [(google.api.field_behavior) = OPTIONAL];
}

// The response for ListFederatedCredentials.
message ListFederatedCredentialsResponse {
  // The federated credentials on this page.
  repeated FederatedCredential federated_credentials = 1;

  // The token for the next page; empty on the last one.
  string next_page_token = 2;
}

// The request for CreateFederatedCredential.
message CreateFederatedCredentialRequest {
  // The `WORKLOAD` service account to create the federated credential on,
  // `organizations/{organization}/serviceAccounts/{service_account}`.
  string parent = 1 [
    (google.api.field_behavior) = REQUIRED,
    (google.api.resource_reference).child_type = "iam.origincloudapis.eu/FederatedCredential"
  ];

  // The federated credential to create: its `display_name`, `issuer`,
  // `conditions`, and optionally its `audience`.
  FederatedCredential federated_credential = 2 [(google.api.field_behavior) = REQUIRED];

  // A UUID. A repeat of the request with the same `request_id` within a
  // day returns the federated credential the first request created, as it
  // is now, instead of creating a second. The same `request_id` with a
  // different request is refused with `CONFLICT`.
  string request_id = 3 [
    (google.api.field_info).format = UUID4,
    (google.api.field_behavior) = OPTIONAL
  ];
}

// The request for DeleteFederatedCredential.
message DeleteFederatedCredentialRequest {
  // The federated credential to delete.
  string name = 1 [
    (google.api.field_behavior) = REQUIRED,
    (google.api.resource_reference).type = "iam.origincloudapis.eu/FederatedCredential"
  ];
}
