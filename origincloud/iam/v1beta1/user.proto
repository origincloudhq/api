syntax = "proto3";

package origincloud.iam.v1beta1;

import "google/api/annotations.proto";
import "google/api/client.proto";
import "google/api/field_behavior.proto";
import "google/api/resource.proto";

// Users. Each user can read only their own profile, by the name `users/me`
// or by their own id; the role bindings they hold are listed by
// ListRoleBindings with the parent `organizations/-`. Anyone who may grant
// roles in an organization can look a user up by email address, to name
// them in a role binding.
//
// (-- api-linter: core::0121::resource-must-support-list=disabled
//     aip.dev/not-precedent: a caller reads only their own profile. --)
service UserService {
  option (google.api.default_host) = "iam.origincloudapis.eu";

  // Returns the caller's own profile. Any other user is `NOT_FOUND`; a
  // service account caller is refused with `BAD_REQUEST`, having no
  // profile.
  rpc GetUser(GetUserRequest) returns (User) {
    option (google.api.http) = {get: "/v1beta1/{name=users/*}"};
    option (google.api.method_signature) = "name";
  }

  // Looks up the user whose account has verified an email address, and
  // answers them with their `name` and their full name, `member`, which is
  // how a role binding names them. Needs `iam.role.assign` on
  // `organization`, the permission a binding of the user needs anyway.
  // Refused with `NOT_FOUND` when no enabled account has verified the
  // address, and with `CONFLICT` when more than one has. The answer leaves
  // `given_name` and `family_name` empty: only the user reads those.
  //
  // (-- api-linter: core::0131::synonyms=disabled
  //     aip.dev/not-precedent: a lookup by an attribute, not a Get by name. --)
  // (-- api-linter: core::0136::http-uri-suffix=disabled
  //     aip.dev/not-precedent: the collection names the noun, users:lookup. --)
  // (-- api-linter: core::0136::response-message-name=disabled
  //     aip.dev/not-precedent: the user looked up is the answer. --)
  rpc LookupUser(LookupUserRequest) returns (User) {
    option (google.api.http) = {get: "/v1beta1/users:lookup"};
    option (google.api.method_signature) = "email,organization";
  }
}

// A person who signs in to the platform.
message User {
  option (google.api.resource) = {
    type: "iam.origincloudapis.eu/User"
    pattern: "users/{user}"
    plural: "users"
    singular: "user"
  };

  // The user's resource name, `users/{user}`, with their id; never
  // `users/me`.
  string name = 1 [(google.api.field_behavior) = IDENTIFIER];

  // The user's full name, `//iam.origincloudapis.eu/users/{user}`, which a
  // role binding names them by as a member.
  string member = 2 [
    (google.api.field_behavior) = OUTPUT_ONLY,
    (google.api.resource_reference).type = "iam.origincloudapis.eu/User"
  ];

  // The email address the user signs in with.
  string email = 3 [(google.api.field_behavior) = OUTPUT_ONLY];

  // Whether the user has confirmed `email`.
  bool email_verified = 4 [(google.api.field_behavior) = OUTPUT_ONLY];

  // The user's given name; empty when they haven't set one.
  string given_name = 5 [(google.api.field_behavior) = OUTPUT_ONLY];

  // The user's family name; empty when they haven't set one.
  string family_name = 6 [(google.api.field_behavior) = OUTPUT_ONLY];
}

// The request for GetUser.
message GetUserRequest {
  // The user to return: `users/me`, or the caller's own `users/{user}`.
  string name = 1 [
    (google.api.field_behavior) = REQUIRED,
    (google.api.resource_reference).type = "iam.origincloudapis.eu/User"
  ];
}

// The request for LookupUser.
message LookupUserRequest {
  // The email address the user's account has verified, matched exactly,
  // case aside.
  string email = 1 [(google.api.field_behavior) = REQUIRED];

  // The full name of the organization the caller looks the user up for,
  // where it needs `iam.role.assign`:
  // `//resourcemanager.origincloudapis.eu/organizations/{organization}`.
  string organization = 2 [
    (google.api.field_behavior) = REQUIRED,
    (google.api.resource_reference).type = "resourcemanager.origincloudapis.eu/Organization"
  ];
}
