syntax = "proto3";

// Secrets: small confidential values, such as a database password, an API
// key or a TLS private key, kept encrypted and versioned by the platform and
// read by the people and workloads you allow.
//
// A secret belongs to a project and a region (`regions/{region}`), never to a
// zone. Its value lives in its versions: each version holds one payload of up
// to 64 KiB, which never changes, and a new value is a new version. Every
// payload is encrypted under a KMS key of the secret's project and region
// before it is stored, and only ciphertext is ever kept.
//
// AccessSecretVersion, GetSecret, GetSecretVersion, ListSecrets and
// ListSecretVersions are answered by the zone that receives the request,
// from its own copy, so they keep working while any one zone of the region
// is down. Every other method is answered by the region's home zone; while it
// is down it is refused with `SERVICE_UNAVAILABLE`, retryable. A change
// reaches the region's other zones within seconds: until it has, an access to
// a version just added is refused with `SERVICE_UNAVAILABLE`, retryable,
// never with `NOT_FOUND`, and `latest` may still name the version before it.
// Reading a version by its number after it was added never answers an older
// payload.
//
// Every change to a secret or a version, every access and every refused
// access is recorded in the organization's audit log with the caller and the
// version.
package origincloud.secretmanager.v1beta1;

import "google/api/annotations.proto";
import "google/api/client.proto";
import "google/api/field_behavior.proto";
import "google/api/field_info.proto";
import "google/api/resource.proto";
import "google/protobuf/field_mask.proto";
import "google/protobuf/timestamp.proto";

// Secrets, their versions, and the access to a version's payload.
service SecretManagerService {
  option (google.api.default_host) = "secretmanager.origincloudapis.eu";

  // Returns a secret, deleted or not, without any payload. Needs
  // `secretmanager.secret.get` on the secret.
  rpc GetSecret(GetSecretRequest) returns (Secret) {
    option (google.api.http) = {get: "/v1beta1/{name=projects/*/regions/*/secrets/*}"};
    option (google.api.method_signature) = "name";
  }

  // Lists a project's secrets in a region, ordered by name, without any
  // payload. Deleted ones are listed only when `show_deleted` is set, so a
  // page may hold fewer secrets than `page_size` and still be followed by
  // another. Needs `secretmanager.secret.list` on the project.
  rpc ListSecrets(ListSecretsRequest) returns (ListSecretsResponse) {
    option (google.api.http) = {get: "/v1beta1/{parent=projects/*/regions/*}/secrets"};
    option (google.api.method_signature) = "parent";
  }

  // Creates a secret, with no version yet, under the id the caller gives in
  // `secret_id`. Its payloads are encrypted under `kms_key`, or, when that is
  // left out, under the project's default Secret Manager key in the region.
  // An id that a secret of the project and region has, including a deleted
  // one still in its recovery window, is refused with `CONFLICT`: restore
  // that secret with RestoreSecret, or delete it with `force` first. Needs
  // `secretmanager.secret.create` on the project.
  rpc CreateSecret(CreateSecretRequest) returns (Secret) {
    option (google.api.http) = {
      post: "/v1beta1/{parent=projects/*/regions/*}/secrets"
      body: "secret"
    };
    option (google.api.method_signature) = "parent,secret,secret_id";
  }

  // Changes a secret's tags, the one field it changes. Setting the tags the
  // secret already has succeeds and changes nothing. A deleted secret can't
  // be changed: restore it first. Needs `secretmanager.secret.update` on the
  // secret.
  rpc UpdateSecret(UpdateSecretRequest) returns (Secret) {
    option (google.api.http) = {
      patch: "/v1beta1/{secret.name=projects/*/regions/*/secrets/*}"
      body: "secret"
    };
    option (google.api.method_signature) = "secret,update_mask";
  }

  // Deletes a secret. By default the deletion is scheduled: the secret
  // becomes `DELETED` at once, none of its versions can be accessed, its id
  // stays taken, and RestoreSecret brings it back until `expire_time`, after
  // `pending_days`. At `expire_time` the secret and every version are
  // destroyed for good and its id is free again. With `force`, the secret is
  // destroyed at once and can't be restored. Deleting a deleted secret
  // without `force` succeeds and changes nothing. Needs
  // `secretmanager.secret.delete` on the secret, and with `force`
  // `secretmanager.secret.force_delete` as well.
  rpc DeleteSecret(DeleteSecretRequest) returns (Secret) {
    option (google.api.http) = {delete: "/v1beta1/{name=projects/*/regions/*/secrets/*}"};
    option (google.api.method_signature) = "name";
  }

  // Restores a deleted secret whose `expire_time` hasn't passed: it becomes
  // `ACTIVE` again, with every version in the state it had. Refused with
  // `CONFLICT` for a secret that isn't deleted. Needs
  // `secretmanager.secret.restore` on the secret, which
  // `secretmanager.secret.delete` doesn't include.
  rpc RestoreSecret(RestoreSecretRequest) returns (Secret) {
    option (google.api.http) = {
      post: "/v1beta1/{name=projects/*/regions/*/secrets/*}:restore"
      body: "*"
    };
    option (google.api.method_signature) = "name";
  }

  // Adds a version holding `payload` to a secret, `ENABLED`, numbered one
  // above the secret's newest version. It becomes `latest`. Refused with
  // `BAD_REQUEST` for a payload over 64 KiB, with `CONFLICT` for a deleted
  // secret, and with `CONFLICT` naming the key when the secret's KMS key is
  // disabled or deleted. Needs `secretmanager.secret_version.add` on the
  // secret.
  //
  // (-- api-linter: core::0136::response-message-name=disabled
  //     aip.dev/not-precedent: it creates a version, so it answers with the version, as a create does. --)
  rpc AddSecretVersion(AddSecretVersionRequest) returns (SecretVersion) {
    option (google.api.http) = {
      post: "/v1beta1/{parent=projects/*/regions/*/secrets/*}:addVersion"
      body: "*"
    };
    option (google.api.method_signature) = "parent,payload";
  }

  // Returns a version's payload, decrypted. `versions/latest` is the newest
  // `ENABLED` version. Refused with `CONFLICT` for a disabled or destroyed
  // version, for a deleted secret, and naming the key when the secret's KMS
  // key is disabled or deleted; with `NOT_FOUND` for `latest` when no version
  // is enabled. Needs `secretmanager.secret_version.access` on the secret.
  rpc AccessSecretVersion(AccessSecretVersionRequest) returns (AccessSecretVersionResponse) {
    option (google.api.http) = {get: "/v1beta1/{name=projects/*/regions/*/secrets/*/versions/*}:access"};
    option (google.api.method_signature) = "name";
  }

  // Returns a version, without its payload. `versions/latest` is the newest
  // `ENABLED` version. Needs `secretmanager.secret_version.get` on the
  // secret.
  rpc GetSecretVersion(GetSecretVersionRequest) returns (SecretVersion) {
    option (google.api.http) = {get: "/v1beta1/{name=projects/*/regions/*/secrets/*/versions/*}"};
    option (google.api.method_signature) = "name";
  }

  // Lists a secret's versions, newest first, without their payloads.
  // Destroyed ones are listed only when `show_deleted` is set. Needs
  // `secretmanager.secret_version.list` on the secret.
  rpc ListSecretVersions(ListSecretVersionsRequest) returns (ListSecretVersionsResponse) {
    option (google.api.http) = {get: "/v1beta1/{parent=projects/*/regions/*/secrets/*}/versions"};
    option (google.api.method_signature) = "parent";
  }

  // Disables a version: AccessSecretVersion refuses it with `CONFLICT`, and
  // `latest` skips it, until it is enabled again. Disabling a disabled
  // version succeeds and changes nothing; a destroyed version is refused
  // with `CONFLICT`. Needs `secretmanager.secret_version.disable` on the
  // secret.
  rpc DisableSecretVersion(DisableSecretVersionRequest) returns (SecretVersion) {
    option (google.api.http) = {
      post: "/v1beta1/{name=projects/*/regions/*/secrets/*/versions/*}:disable"
      body: "*"
    };
    option (google.api.method_signature) = "name";
  }

  // Enables a disabled version again. Enabling an enabled version succeeds
  // and changes nothing; a destroyed version is refused with `CONFLICT`.
  // Needs `secretmanager.secret_version.enable` on the secret.
  rpc EnableSecretVersion(EnableSecretVersionRequest) returns (SecretVersion) {
    option (google.api.http) = {
      post: "/v1beta1/{name=projects/*/regions/*/secrets/*/versions/*}:enable"
      body: "*"
    };
    option (google.api.method_signature) = "name";
  }

  // Destroys a version's payload at once and for good: the version becomes
  // `DELETED`, nothing can read its payload again, and its number is never
  // given to another version. There is no recovery window and no undo.
  // Destroying a destroyed version succeeds and changes nothing. Needs
  // `secretmanager.secret_version.destroy` on the secret.
  rpc DestroySecretVersion(DestroySecretVersionRequest) returns (SecretVersion) {
    option (google.api.http) = {
      post: "/v1beta1/{name=projects/*/regions/*/secrets/*/versions/*}:destroy"
      body: "*"
    };
    option (google.api.method_signature) = "name";
  }
}

// A secret: a name, the KMS key its payloads are encrypted under, and the
// versions that hold its value.
message Secret {
  option (google.api.resource) = {
    type: "secretmanager.origincloudapis.eu/Secret"
    pattern: "projects/{project}/regions/{region}/secrets/{secret}"
    plural: "secrets"
    singular: "secret"
  };

  // Whether a secret is in use or scheduled for deletion.
  enum State {
    // Not set.
    STATE_UNSPECIFIED = 0;
    // In use: its enabled versions can be accessed.
    ACTIVE = 1;
    // Deleted: none of its versions can be accessed. Until `expire_time`
    // RestoreSecret brings it back; at `expire_time` it is destroyed.
    DELETED = 2;
  }

  // The secret's resource name,
  // `projects/{project}/regions/{region}/secrets/{secret}`. Its last segment
  // is the `secret_id` given to CreateSecret.
  string name = 1 [(google.api.field_behavior) = IDENTIFIER];

  // Whether the secret is in use or scheduled for deletion.
  State state = 2 [(google.api.field_behavior) = OUTPUT_ONLY];

  // The full name of the KMS key every payload of the secret is encrypted
  // under, `//kms.origincloudapis.eu/projects/{project}/regions/{region}/keys/{key}`:
  // an `ENCRYPT_DECRYPT` key of the secret's own project and region. Left out
  // on CreateSecret, it is the project's default Secret Manager key in the
  // region: a key the platform creates in your project with its first secret
  // there that names no key, tagged `origin:name=secretmanager` and marked
  // `platform_managed`, which you see in your KMS key list and audit log but
  // can't change or delete. A key of another project or region, or a signing
  // key, is refused with `BAD_REQUEST`. It can't be changed after the secret
  // is created. While the key is disabled or deleted, AddSecretVersion and
  // AccessSecretVersion are refused with `CONFLICT` naming it; once it is
  // enabled again, they succeed again.
  optional string kms_key = 3 [
    (google.api.field_behavior) = OPTIONAL,
    (google.api.field_behavior) = IMMUTABLE,
    (google.api.resource_reference).type = "kms.origincloudapis.eu/Key"
  ];

  // When the secret was created.
  google.protobuf.Timestamp create_time = 4 [(google.api.field_behavior) = OUTPUT_ONLY];

  // When the secret last changed.
  google.protobuf.Timestamp update_time = 5 [(google.api.field_behavior) = OUTPUT_ONLY];

  // When the secret was deleted; unset unless it is `DELETED`.
  google.protobuf.Timestamp delete_time = 6 [(google.api.field_behavior) = OUTPUT_ONLY];

  // When a deleted secret is destroyed with its versions, and its id becomes
  // free; unset unless it is `DELETED`. RestoreSecret is refused after it.
  google.protobuf.Timestamp expire_time = 7 [(google.api.field_behavior) = OUTPUT_ONLY];

  // Labels of your own, at most 50. The `origin:name` tag is the name the
  // console shows. Tags aren't secret: never put a secret value in one.
  map<string, string> tags = 8 [(google.api.field_behavior) = OPTIONAL];
}

// A version of a secret: one payload, which never changes.
message SecretVersion {
  option (google.api.resource) = {
    type: "secretmanager.origincloudapis.eu/SecretVersion"
    pattern: "projects/{project}/regions/{region}/secrets/{secret}/versions/{version}"
    plural: "secretVersions"
    singular: "secretVersion"
  };

  // Whether a version's payload can be accessed.
  enum State {
    // Not set.
    STATE_UNSPECIFIED = 0;
    // Its payload can be accessed, and the newest enabled version is
    // `latest`.
    ENABLED = 1;
    // Its payload is kept but can't be accessed until the version is enabled
    // again.
    DISABLED = 2;
    // Destroyed: its payload is gone for good.
    DELETED = 3;
  }

  // The version's resource name,
  // `projects/{project}/regions/{region}/secrets/{secret}/versions/{version}`,
  // numbered from 1 in the order the versions were added. A request may name
  // `versions/latest` instead of a number; a response always names the
  // number.
  string name = 1 [(google.api.field_behavior) = IDENTIFIER];

  // Whether the version's payload can be accessed.
  State state = 2 [(google.api.field_behavior) = OUTPUT_ONLY];

  // When the version was added.
  google.protobuf.Timestamp create_time = 3 [(google.api.field_behavior) = OUTPUT_ONLY];

  // When the version's payload was destroyed; unset unless it is `DELETED`.
  google.protobuf.Timestamp destroy_time = 4 [(google.api.field_behavior) = OUTPUT_ONLY];
}

// A secret version's value.
message SecretPayload {
  // The value: any bytes, at most 64 KiB (65,536 bytes). Text is sent as its
  // UTF-8 bytes; in JSON, as every bytes field, it is base64.
  bytes data = 1 [(google.api.field_behavior) = REQUIRED];
}

// The request for GetSecret.
message GetSecretRequest {
  // The secret to return.
  string name = 1 [
    (google.api.field_behavior) = REQUIRED,
    (google.api.resource_reference).type = "secretmanager.origincloudapis.eu/Secret"
  ];
}

// The request for ListSecrets.
message ListSecretsRequest {
  // The project and region whose secrets to list,
  // `projects/{project}/regions/{region}`.
  string parent = 1 [
    (google.api.field_behavior) = REQUIRED,
    (google.api.resource_reference).child_type = "secretmanager.origincloudapis.eu/Secret"
  ];

  // The most secrets to return; the server clamps it, and 0 means its
  // default.
  int32 page_size = 2 [(google.api.field_behavior) = OPTIONAL];

  // A previous response's `next_page_token`, for the page after it.
  string page_token = 3 [(google.api.field_behavior) = OPTIONAL];

  // Whether deleted secrets still in their recovery window are listed too.
  bool show_deleted = 4 [(google.api.field_behavior) = OPTIONAL];
}

// The response for ListSecrets.
message ListSecretsResponse {
  // The secrets on this page.
  repeated Secret secrets = 1;

  // The token for the next page; empty on the last one.
  string next_page_token = 2;
}

// The request for CreateSecret.
message CreateSecretRequest {
  // The project and region to create the secret in,
  // `projects/{project}/regions/{region}`.
  string parent = 1 [
    (google.api.field_behavior) = REQUIRED,
    (google.api.resource_reference).child_type = "secretmanager.origincloudapis.eu/Secret"
  ];

  // The id of the secret, the last segment of its name: 1 to 63 characters,
  // lowercase letters, digits and hyphens, starting with a letter
  // (`[a-z][a-z0-9-]{0,62}`), such as `billing-db-password`. It is how people
  // and configuration refer to the secret, and it can't be changed. Anything
  // else is refused with `BAD_REQUEST`.
  string secret_id = 2 [(google.api.field_behavior) = REQUIRED];

  // The secret to create: optionally its `kms_key` and its tags.
  Secret secret = 3 [(google.api.field_behavior) = REQUIRED];

  // A UUID; a repeat with the same id within a day returns the secret the
  // first request created, as it was then, instead of answering `CONFLICT`.
  string request_id = 4 [
    (google.api.field_info).format = UUID4,
    (google.api.field_behavior) = OPTIONAL
  ];
}

// The request for UpdateSecret.
message UpdateSecretRequest {
  // The secret, by its name, with the tags to replace its tags with.
  Secret secret = 1 [(google.api.field_behavior) = REQUIRED];

  // The fields to change: `tags`. `*` is the same.
  google.protobuf.FieldMask update_mask = 2 [(google.api.field_behavior) = REQUIRED];

  // A UUID; a repeat with the same id within a day returns the secret as the
  // first request left it, instead of changing it again.
  string request_id = 3 [
    (google.api.field_info).format = UUID4,
    (google.api.field_behavior) = OPTIONAL
  ];
}

// The request for DeleteSecret.
message DeleteSecretRequest {
  // The secret to delete.
  string name = 1 [
    (google.api.field_behavior) = REQUIRED,
    (google.api.resource_reference).type = "secretmanager.origincloudapis.eu/Secret"
  ];

  // How many days the deleted secret can still be restored: 7 to 30. Left
  // out, 30. Anything else is refused with `BAD_REQUEST`, and so is setting
  // it together with `force`.
  //
  // (-- api-linter: core::0135::request-unknown-fields=disabled
  //     aip.dev/not-precedent: a secret's deletion has a recovery window the caller chooses. --)
  optional int32 pending_days = 2 [(google.api.field_behavior) = OPTIONAL];

  // Destroy the secret and every version at once, with no recovery window,
  // and free its id; a secret already deleted is destroyed too. Needs
  // `secretmanager.secret.force_delete` on the secret beside
  // `secretmanager.secret.delete`.
  bool force = 3 [(google.api.field_behavior) = OPTIONAL];

  // A UUID; a repeat with the same id within a day returns the secret as the
  // first request left it.
  string request_id = 4 [
    (google.api.field_info).format = UUID4,
    (google.api.field_behavior) = OPTIONAL
  ];
}

// The request for RestoreSecret.
message RestoreSecretRequest {
  // The deleted secret to restore.
  string name = 1 [
    (google.api.field_behavior) = REQUIRED,
    (google.api.resource_reference).type = "secretmanager.origincloudapis.eu/Secret"
  ];

  // A UUID; a repeat with the same id within a day returns the secret as the
  // first request left it, instead of answering `CONFLICT`.
  string request_id = 2 [
    (google.api.field_info).format = UUID4,
    (google.api.field_behavior) = OPTIONAL
  ];
}

// The request for AddSecretVersion.
message AddSecretVersionRequest {
  // The secret to add the version to.
  string parent = 1 [
    (google.api.field_behavior) = REQUIRED,
    (google.api.resource_reference).type = "secretmanager.origincloudapis.eu/Secret"
  ];

  // The version's value, at most 64 KiB.
  SecretPayload payload = 2 [(google.api.field_behavior) = REQUIRED];

  // A UUID; a repeat with the same id within a day returns the version the
  // first request added, instead of adding another.
  string request_id = 3 [
    (google.api.field_info).format = UUID4,
    (google.api.field_behavior) = OPTIONAL
  ];
}

// The request for AccessSecretVersion.
message AccessSecretVersionRequest {
  // The version whose payload to return, by its number or as
  // `versions/latest`.
  string name = 1 [
    (google.api.field_behavior) = REQUIRED,
    (google.api.resource_reference).type = "secretmanager.origincloudapis.eu/SecretVersion"
  ];
}

// The response for AccessSecretVersion.
message AccessSecretVersionResponse {
  // The full name of the version accessed, by its number, also when the
  // request named `latest`:
  // `//secretmanager.origincloudapis.eu/projects/{project}/regions/{region}/secrets/{secret}/versions/{version}`.
  string secret_version = 1 [(google.api.resource_reference).type = "secretmanager.origincloudapis.eu/SecretVersion"];

  // The version's value.
  SecretPayload payload = 2;
}

// The request for GetSecretVersion.
message GetSecretVersionRequest {
  // The version to return, by its number or as `versions/latest`.
  string name = 1 [
    (google.api.field_behavior) = REQUIRED,
    (google.api.resource_reference).type = "secretmanager.origincloudapis.eu/SecretVersion"
  ];
}

// The request for ListSecretVersions.
message ListSecretVersionsRequest {
  // The secret whose versions to list.
  string parent = 1 [
    (google.api.field_behavior) = REQUIRED,
    (google.api.resource_reference).child_type = "secretmanager.origincloudapis.eu/SecretVersion"
  ];

  // The most versions to return; the server clamps it, and 0 means its
  // default.
  int32 page_size = 2 [(google.api.field_behavior) = OPTIONAL];

  // A previous response's `next_page_token`, for the page after it.
  string page_token = 3 [(google.api.field_behavior) = OPTIONAL];

  // Whether destroyed versions are listed too.
  bool show_deleted = 4 [(google.api.field_behavior) = OPTIONAL];
}

// The response for ListSecretVersions.
message ListSecretVersionsResponse {
  // The versions on this page.
  repeated SecretVersion secret_versions = 1;

  // The token for the next page; empty on the last one.
  string next_page_token = 2;
}

// The request for DisableSecretVersion.
message DisableSecretVersionRequest {
  // The version to disable, by its number.
  string name = 1 [
    (google.api.field_behavior) = REQUIRED,
    (google.api.resource_reference).type = "secretmanager.origincloudapis.eu/SecretVersion"
  ];

  // A UUID; a repeat with the same id within a day returns the version as
  // the first request left it.
  string request_id = 2 [
    (google.api.field_info).format = UUID4,
    (google.api.field_behavior) = OPTIONAL
  ];
}

// The request for EnableSecretVersion.
message EnableSecretVersionRequest {
  // The version to enable, by its number.
  string name = 1 [
    (google.api.field_behavior) = REQUIRED,
    (google.api.resource_reference).type = "secretmanager.origincloudapis.eu/SecretVersion"
  ];

  // A UUID; a repeat with the same id within a day returns the version as
  // the first request left it.
  string request_id = 2 [
    (google.api.field_info).format = UUID4,
    (google.api.field_behavior) = OPTIONAL
  ];
}

// The request for DestroySecretVersion.
message DestroySecretVersionRequest {
  // The version to destroy, by its number.
  string name = 1 [
    (google.api.field_behavior) = REQUIRED,
    (google.api.resource_reference).type = "secretmanager.origincloudapis.eu/SecretVersion"
  ];

  // A UUID; a repeat with the same id within a day returns the version as
  // the first request left it.
  string request_id = 2 [
    (google.api.field_info).format = UUID4,
    (google.api.field_behavior) = OPTIONAL
  ];
}
