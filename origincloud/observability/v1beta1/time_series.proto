syntax = "proto3";

// The metrics the platform collects for a project's compute instances,
// volumes and network interfaces.
package origincloud.observability.v1beta1;

import "google/api/annotations.proto";
import "google/api/client.proto";
import "google/api/field_behavior.proto";
import "google/api/resource.proto";
import "google/protobuf/duration.proto";
import "google/protobuf/timestamp.proto";

// The metrics the platform collects for a project's compute instances,
// volumes and network interfaces: CPU time, network traffic, and volume
// reads and writes. Every metric is a counter, a running total that grows
// while the instance runs. A query never returns the raw total: for each
// period of the window it asks for, it returns the counter's average
// per-second increase over the period (`RATE`) or its total increase
// (`INCREASE`). The platform collects a value for each counter every 30
// seconds while the instance runs, and keeps the values for 90 days. A
// volume or a network interface is measured through the instance it is
// attached to, so it has values only while attached to a running instance.
service MetricService {
  option (google.api.default_host) = "observability.origincloudapis.eu";

  // Returns a resource's time series for the metrics asked, one per
  // metric, in the order asked. Needs `observability.metric.get` on the
  // resource.
  //
  // A query is limited in what it costs. Its points, the window's length
  // divided by `period`, plus one, for each of its metrics, are at most
  // 11,000 in all, and an organization may run 60 queries a minute and 4 at
  // a time. A query over any of these limits is refused with
  // `FAILED_PRECONDITION`, the same message for all three: one within the
  // points limit succeeds when sent again a few seconds later.
  //
  // Each query answered is billed as one request, however many series or
  // points it returns; a refused one isn't.
  rpc QueryTimeSeries(QueryTimeSeriesRequest) returns (QueryTimeSeriesResponse) {
    option (google.api.http) = {get: "/v1beta1/{parent=projects/*}/timeSeries:query"};
  }
}

// The request for QueryTimeSeries.
message QueryTimeSeriesRequest {
  // How each point is computed from the counter over its period.
  enum Statistic {
    // Not set.
    STATISTIC_UNSPECIFIED = 0;
    // The average per-second increase over the period, such as bytes per
    // second.
    RATE = 1;
    // The total increase over the period, such as bytes transferred in it.
    INCREASE = 2;
  }

  // The project the resource is in, `projects/{project}`.
  string parent = 1 [
    (google.api.field_behavior) = REQUIRED,
    (google.api.resource_reference).type = "resourcemanager.origincloudapis.eu/Project"
  ];

  // The resource whose metrics to return, in `parent`: an instance,
  // `projects/{project}/zones/{zone}/instances/{instance}`, a volume,
  // `projects/{project}/zones/{zone}/volumes/{volume}`, or a network
  // interface,
  // `projects/{project}/zones/{zone}/networkInterfaces/{network_interface}`.
  string resource = 2 [
    (google.api.field_behavior) = REQUIRED,
    (google.api.resource_reference).type = "*"
  ];

  // The metrics to return, such as `oc_compute_instance_cpu_seconds_total`,
  // at least one. A metric of another kind of resource returns a series
  // without points.
  repeated string metrics = 3 [(google.api.field_behavior) = REQUIRED];

  // The start of the window: the first point is at it.
  google.protobuf.Timestamp start_time = 4 [(google.api.field_behavior) = REQUIRED];

  // The end of the window, not before `start_time`.
  google.protobuf.Timestamp end_time = 5 [(google.api.field_behavior) = REQUIRED];

  // The length of each period, in whole seconds, at least one: the points
  // are this far apart, and each covers the period that ends at it. A
  // value is collected every 30 seconds and a point needs two inside its
  // period, so a period under 60 seconds often has none.
  google.protobuf.Duration period = 6 [(google.api.field_behavior) = REQUIRED];

  // How each point is computed.
  Statistic statistic = 7 [(google.api.field_behavior) = REQUIRED];
}

// The response for QueryTimeSeries.
message QueryTimeSeriesResponse {
  // One series per metric asked, in the order asked.
  repeated TimeSeries time_series = 1;
}

// A metric of one resource over the window: its points, in time order.
message TimeSeries {
  // The metric, as asked.
  string metric = 1 [(google.api.field_behavior) = OUTPUT_ONLY];

  // The resource, as asked.
  string resource = 2 [(google.api.field_behavior) = OUTPUT_ONLY];

  // The unit of the counter, such as `seconds` or `bytes`: a `RATE` of a
  // `bytes` counter is bytes per second.
  string unit = 3 [(google.api.field_behavior) = OUTPUT_ONLY];

  // The points, one per period that has values, in time order. Empty when
  // the platform has no values for the resource and metric in the window,
  // such as for a stopped instance or a window older than 90 days.
  repeated Point points = 4 [(google.api.field_behavior) = OUTPUT_ONLY];
}

// The statistic over one period.
message Point {
  // The end of the period.
  google.protobuf.Timestamp end_time = 1 [(google.api.field_behavior) = OUTPUT_ONLY];

  // The statistic's value, in the series' `unit`, per second for `RATE`.
  double value = 2 [(google.api.field_behavior) = OUTPUT_ONLY];
}
