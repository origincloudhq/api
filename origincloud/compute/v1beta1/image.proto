syntax = "proto3";

package origincloud.compute.v1beta1;

import "google/api/annotations.proto";
import "google/api/client.proto";
import "google/api/field_behavior.proto";
import "google/api/field_info.proto";
import "google/api/resource.proto";
import "google/protobuf/empty.proto";
import "google/protobuf/field_mask.proto";

// Images: what an instance's boot volume is created from, in one zone. A
// project creates its own from protected snapshots in the zone; the
// platform's public images are in `PublicImageService`.
service ImageService {
  option (google.api.default_host) = "compute.origincloudapis.eu";

  // Returns one of the project's own images.
  rpc GetImage(GetImageRequest) returns (Image) {
    option (google.api.http) = {get: "/v1beta1/{name=projects/*/zones/*/images/*}"};
    option (google.api.method_signature) = "name";
  }

  // Lists the project's own images in a zone, oldest first. The public
  // images are listed by `ListPublicImages`.
  rpc ListImages(ListImagesRequest) returns (ListImagesResponse) {
    option (google.api.http) = {get: "/v1beta1/{parent=projects/*/zones/*}/images"};
    option (google.api.method_signature) = "parent";
  }

  // Creates an image from the project's protected snapshots in the zone.
  // The snapshots can't be unprotected while the image exists.
  rpc CreateImage(CreateImageRequest) returns (Image) {
    option (google.api.http) = {
      post: "/v1beta1/{parent=projects/*/zones/*}/images"
      body: "image"
    };
    option (google.api.method_signature) = "parent,image";
  }

  // Changes an image's description or tags.
  rpc UpdateImage(UpdateImageRequest) returns (Image) {
    option (google.api.http) = {
      patch: "/v1beta1/{image.name=projects/*/zones/*/images/*}"
      body: "image"
    };
    option (google.api.method_signature) = "image,update_mask";
  }

  // Deletes an image. Instances launched from it are unaffected.
  rpc DeleteImage(DeleteImageRequest) returns (google.protobuf.Empty) {
    option (google.api.http) = {delete: "/v1beta1/{name=projects/*/zones/*/images/*}"};
    option (google.api.method_signature) = "name";
  }
}

// A project's own image, which an instance's boot volume can be created
// from.
message Image {
  option (google.api.resource) = {
    type: "compute.origincloudapis.eu/Image"
    pattern: "projects/{project}/zones/{zone}/images/{image}"
    plural: "images"
    singular: "image"
  };

  // The CPU architecture an image boots on.
  enum Architecture {
    // Not set.
    ARCHITECTURE_UNSPECIFIED = 0;
    // 64-bit x86.
    X86_64 = 1;
  }

  // The operating system family of an image.
  enum Platform {
    // Not set.
    PLATFORM_UNSPECIFIED = 0;
    // Linux or another Unix.
    LINUX_UNIX = 1;
  }

  // Where the image is in its lifecycle.
  enum State {
    // Not set.
    STATE_UNSPECIFIED = 0;
    // Instances can be launched from it.
    AVAILABLE = 1;
  }

  // The image's resource name.
  string name = 1 [(google.api.field_behavior) = IDENTIFIER];

  // The image's URN, the identifier access policies and the audit log use.
  string urn = 2 [(google.api.field_behavior) = OUTPUT_ONLY];

  // What the image holds, as you describe it.
  string description = 3 [(google.api.field_behavior) = REQUIRED];

  // The account an instance launched from the image logs in as, unless the
  // launch names another: a POSIX user name of at most 32 lowercase
  // letters, digits, underscores and hyphens, starting with a letter or an
  // underscore, and not `root`. `cloud` when left empty.
  string default_user = 4 [
    (google.api.field_behavior) = IMMUTABLE,
    (google.api.field_behavior) = OPTIONAL
  ];

  // The device name of the disk the image boots from: one of the
  // `block_devices`' `device`.
  string root_device = 5 [
    (google.api.field_behavior) = REQUIRED,
    (google.api.field_behavior) = IMMUTABLE
  ];

  // The image's disks, each created for an instance launched from it.
  repeated ImageBlockDevice block_devices = 6 [
    (google.api.field_behavior) = REQUIRED,
    (google.api.field_behavior) = IMMUTABLE
  ];

  // The CPU architecture it boots on.
  Architecture architecture = 7 [(google.api.field_behavior) = OUTPUT_ONLY];

  // Its operating system family.
  Platform platform = 8 [(google.api.field_behavior) = OUTPUT_ONLY];

  // Where it is in its lifecycle.
  State state = 9 [(google.api.field_behavior) = OUTPUT_ONLY];

  // The principal that created the image, such as `user:<id>`.
  string creator = 10 [(google.api.field_behavior) = OUTPUT_ONLY];

  // Labels of your own, at most 50. The `origin:name` tag is the name the
  // console shows.
  map<string, string> tags = 11 [(google.api.field_behavior) = OPTIONAL];
}

// A disk of an image.
message ImageBlockDevice {
  // The device name the disk appears under on every instance launched from
  // the image: `vda` to `vdz` but `vdc`, unique within the image.
  string device = 1 [(google.api.field_behavior) = REQUIRED];

  // The disk's size in GiB, at least the snapshot's.
  int32 size_gib = 2 [(google.api.field_behavior) = REQUIRED];

  // The protected snapshot the disk is created from, in the image's
  // project and zone; an empty disk when left empty.
  string source_snapshot = 3 [
    (google.api.field_behavior) = OPTIONAL,
    (google.api.resource_reference).type = "pvs.origincloudapis.eu/Snapshot"
  ];
}

// The request for GetImage.
message GetImageRequest {
  // The image to return.
  string name = 1 [
    (google.api.field_behavior) = REQUIRED,
    (google.api.resource_reference).type = "compute.origincloudapis.eu/Image"
  ];
}

// The request for ListImages.
message ListImagesRequest {
  // The zone whose images to list, `projects/{project}/zones/{zone}`.
  string parent = 1 [
    (google.api.field_behavior) = REQUIRED,
    (google.api.resource_reference).child_type = "compute.origincloudapis.eu/Image"
  ];

  // The most images to return; the server clamps it, and 0 means its
  // default.
  int32 page_size = 2 [(google.api.field_behavior) = OPTIONAL];

  // A previous response's `next_page_token`, for the page after it.
  string page_token = 3 [(google.api.field_behavior) = OPTIONAL];
}

// The response for ListImages.
message ListImagesResponse {
  // The images on this page.
  repeated Image images = 1;

  // The token for the next page; empty on the last one.
  string next_page_token = 2;
}

// The request for CreateImage.
message CreateImageRequest {
  // The zone to create the image in, `projects/{project}/zones/{zone}`.
  string parent = 1 [
    (google.api.field_behavior) = REQUIRED,
    (google.api.resource_reference).child_type = "compute.origincloudapis.eu/Image"
  ];

  // The image to create: its description, root device and disks, and
  // optionally its default user and tags.
  Image image = 2 [(google.api.field_behavior) = REQUIRED];

  // A UUID; a repeat with the same id returns the first request's image
  // instead of creating a second one.
  string request_id = 3 [
    (google.api.field_info).format = UUID4,
    (google.api.field_behavior) = OPTIONAL
  ];
}

// The request for UpdateImage.
message UpdateImageRequest {
  // The image, by its name, with the fields to change.
  Image image = 1 [(google.api.field_behavior) = REQUIRED];

  // The fields to change: `description`, `tags`, or both. `*` is both.
  google.protobuf.FieldMask update_mask = 2 [(google.api.field_behavior) = REQUIRED];
}

// The request for DeleteImage.
message DeleteImageRequest {
  // The image to delete.
  string name = 1 [
    (google.api.field_behavior) = REQUIRED,
    (google.api.resource_reference).type = "compute.origincloudapis.eu/Image"
  ];
}
