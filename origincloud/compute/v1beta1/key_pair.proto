syntax = "proto3";

package origincloud.compute.v1beta1;

import "google/api/annotations.proto";
import "google/api/client.proto";
import "google/api/field_behavior.proto";
import "google/api/field_info.proto";
import "google/api/resource.proto";
import "google/protobuf/empty.proto";
import "google/protobuf/field_mask.proto";

// Key pairs: SSH public keys an instance installs for its login user at
// launch. A key pair belongs to its project and can be used in every zone.
// Import a key you have, or have the platform generate one and return its
// private key once.
service KeyPairService {
  option (google.api.default_host) = "compute.origincloudapis.eu";

  // Returns a key pair, its public key only.
  rpc GetKeyPair(GetKeyPairRequest) returns (KeyPair) {
    option (google.api.http) = {get: "/v1beta1/{name=projects/*/keyPairs/*}"};
    option (google.api.method_signature) = "name";
  }

  // Lists a project's key pairs, oldest first.
  rpc ListKeyPairs(ListKeyPairsRequest) returns (ListKeyPairsResponse) {
    option (google.api.http) = {get: "/v1beta1/{parent=projects/*}/keyPairs"};
    option (google.api.method_signature) = "parent";
  }

  // Creates a key pair: imports `public_key`, or, left empty, generates an
  // `ssh-ed25519` key and returns its private half in `private_key`, in
  // this response only. A repeat of a generating request with the same
  // `request_id` can't return the private key again, and is refused with
  // `CONFLICT`, its `ErrorInfo` metadata naming the key pair under
  // `keyPair`: delete it and create another.
  rpc CreateKeyPair(CreateKeyPairRequest) returns (KeyPair) {
    option (google.api.http) = {
      post: "/v1beta1/{parent=projects/*}/keyPairs"
      body: "key_pair"
    };
    option (google.api.method_signature) = "parent,key_pair";
  }

  // Changes a key pair's tags.
  rpc UpdateKeyPair(UpdateKeyPairRequest) returns (KeyPair) {
    option (google.api.http) = {
      patch: "/v1beta1/{key_pair.name=projects/*/keyPairs/*}"
      body: "key_pair"
    };
    option (google.api.method_signature) = "key_pair,update_mask";
  }

  // Deletes a key pair. Instances launched with it keep the key installed.
  rpc DeleteKeyPair(DeleteKeyPairRequest) returns (google.protobuf.Empty) {
    option (google.api.http) = {delete: "/v1beta1/{name=projects/*/keyPairs/*}"};
    option (google.api.method_signature) = "name";
  }
}

// An SSH public key, and on creation the private key generated for it.
message KeyPair {
  option (google.api.resource) = {
    type: "compute.origincloudapis.eu/KeyPair"
    pattern: "projects/{project}/keyPairs/{key_pair}"
    plural: "keyPairs"
    singular: "keyPair"
  };

  // The key pair's resource name.
  string name = 1 [(google.api.field_behavior) = IDENTIFIER];

  // The key pair's URN, the identifier access policies and the audit log
  // use.
  string urn = 2 [(google.api.field_behavior) = OUTPUT_ONLY];

  // The OpenSSH public key line, such as `ssh-ed25519 AAAA... comment`.
  // Left empty, the platform generates the key pair.
  string public_key = 3 [
    (google.api.field_behavior) = IMMUTABLE,
    (google.api.field_behavior) = OPTIONAL
  ];

  // The generated private key in OpenSSH format, in the response that
  // generated it and never again: the platform keeps only the public key.
  // Empty in every other response.
  string private_key = 4 [(google.api.field_behavior) = OUTPUT_ONLY];

  // The principal that created the key pair, such as `user:<id>` or
  // `service_account:<id>`.
  string creator = 5 [(google.api.field_behavior) = OUTPUT_ONLY];

  // Labels of your own, at most 50. The `origin:name` tag is the name the
  // console shows, and the comment of a generated key.
  map<string, string> tags = 6 [(google.api.field_behavior) = OPTIONAL];
}

// The request for GetKeyPair.
message GetKeyPairRequest {
  // The key pair to return.
  string name = 1 [
    (google.api.field_behavior) = REQUIRED,
    (google.api.resource_reference).type = "compute.origincloudapis.eu/KeyPair"
  ];
}

// The request for ListKeyPairs.
message ListKeyPairsRequest {
  // The project whose key pairs to list, `projects/{project}`.
  string parent = 1 [
    (google.api.field_behavior) = REQUIRED,
    (google.api.resource_reference).child_type = "compute.origincloudapis.eu/KeyPair"
  ];

  // The most key pairs to return; the server clamps it, and 0 means its
  // default.
  int32 page_size = 2 [(google.api.field_behavior) = OPTIONAL];

  // A previous response's `next_page_token`, for the page after it.
  string page_token = 3 [(google.api.field_behavior) = OPTIONAL];
}

// The response for ListKeyPairs.
message ListKeyPairsResponse {
  // The key pairs on this page.
  repeated KeyPair key_pairs = 1;

  // The token for the next page; empty on the last one.
  string next_page_token = 2;
}

// The request for CreateKeyPair.
message CreateKeyPairRequest {
  // The project to create the key pair in, `projects/{project}`.
  string parent = 1 [
    (google.api.field_behavior) = REQUIRED,
    (google.api.resource_reference).child_type = "compute.origincloudapis.eu/KeyPair"
  ];

  // The key pair to create: the public key to import, or none to generate
  // one, and optionally its tags.
  KeyPair key_pair = 2 [(google.api.field_behavior) = REQUIRED];

  // A UUID; a repeat with the same id creates no second key pair. A repeat
  // importing a key returns the first request's key pair; a repeat
  // generating one is refused with `CONFLICT`, as the private key went to
  // the first request only, and the error's `ErrorInfo` metadata names the
  // key pair under `keyPair`.
  string request_id = 3 [
    (google.api.field_info).format = UUID4,
    (google.api.field_behavior) = OPTIONAL
  ];
}

// The request for UpdateKeyPair.
message UpdateKeyPairRequest {
  // The key pair, by its name, with the tags to set.
  KeyPair key_pair = 1 [(google.api.field_behavior) = REQUIRED];

  // The fields to change: `tags`, the only field that changes. `*` is the
  // same.
  google.protobuf.FieldMask update_mask = 2 [(google.api.field_behavior) = REQUIRED];
}

// The request for DeleteKeyPair.
message DeleteKeyPairRequest {
  // The key pair to delete.
  string name = 1 [
    (google.api.field_behavior) = REQUIRED,
    (google.api.resource_reference).type = "compute.origincloudapis.eu/KeyPair"
  ];
}
